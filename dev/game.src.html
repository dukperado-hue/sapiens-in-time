<title>Sapiens in Time</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Noto+Sans+Cuneiform&family=Noto+Sans+Egyptian+Hieroglyphs&family=Pridi:wght@400;600&family=Silkscreen&display=swap">
<style>
/* Layout: one firelit column (max 480px), a field journal kept beside the fire; single dark look by choice. */
:root{
  --void:#070504;
  --night:#110d0b;
  --soot:#1b1511;
  --char:#271f19;
  --line:#3b3028;
  --bone:#ede4d4;
  --ash:#a0948a;
  --ochre:#c9623a;
  --ochre-dk:#7a3520;
  --ember:#eba84b;
  --good:#86b06d;
  --warn:#df9442;
  --bad:#d65a40;
  --myth:#dcc68f;
  --display:'Pridi', 'Noto Serif Thai', Georgia, 'PingFang SC','Hiragino Sans','Hiragino Kaku Gothic ProN','Apple SD Gothic Neo','Noto Sans CJK SC','Noto Sans JP','Noto Sans KR','Microsoft YaHei','Malgun Gothic',serif;
  --body:'Anuphan', 'Noto Sans Thai', 'PingFang SC','Hiragino Sans','Hiragino Kaku Gothic ProN','Apple SD Gothic Neo','Noto Sans CJK SC','Noto Sans JP','Noto Sans KR','Microsoft YaHei','Malgun Gothic',system-ui, sans-serif;
  --px:'Silkscreen', 'Anuphan', 'PingFang SC','Hiragino Sans','Hiragino Kaku Gothic ProN','Apple SD Gothic Neo','Noto Sans CJK SC','Noto Sans JP','Noto Sans KR','Microsoft YaHei','Malgun Gothic',ui-monospace, monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--bone)}
body{font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#app{max-width:480px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- intro ---------- */
[hidden]{display:none!important}
#intro{position:fixed;inset:0;background:var(--void);display:flex;flex-direction:column;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 32px) max(28px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(28px, env(safe-area-inset-left,0px));z-index:50}
.intro-lines{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:22px;width:100%}
.intro-lines p{margin:0;font-family:var(--display);font-size:clamp(20px,5.6vw,27px);line-height:1.5;color:var(--bone)}
.intro-lines p.dim{color:var(--ash)}
.intro-lines p.em{color:var(--ember)}
.caret{display:inline-block;width:.5em;height:1.1em;background:var(--ember);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.intro-go{margin:44px auto 0;max-width:440px;width:100%}
.skip{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);right:max(16px, env(safe-area-inset-right,0px));background:var(--soot);border:1px solid var(--line);color:var(--bone);font-family:var(--body);font-size:15px;letter-spacing:.02em;padding:10px 18px;min-height:44px;min-width:64px;cursor:pointer}
.introLang{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px, env(safe-area-inset-left,0px));right:96px}
.langBtns{display:flex;flex-wrap:wrap;gap:6px}
.langBtns button{background:var(--soot);border:1px solid var(--line);color:var(--ash);font:inherit;font-size:14px;padding:8px 11px;min-height:40px;cursor:pointer}
.langBtns button[aria-pressed="true"]{background:var(--char);border-color:var(--ember);color:var(--bone)}
.homeLang{margin:2px 0 10px}
.whoRow{display:flex;gap:10px;align-items:flex-start}.whoRow .who{flex:1;min-width:0}
.avatar{flex:none;width:48px;height:48px;padding:1px;margin-top:6px;border:1px solid var(--line);background:linear-gradient(#3a2e24,#241c16);cursor:pointer}
.famGrid{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:flex-end;margin:8px 0}
.fm{display:flex;flex-direction:column;align-items:center;width:86px;text-align:center;gap:4px}
.fm canvas{background:linear-gradient(#3a2e24,#241c16);border:1px solid var(--line)}
.fm.me canvas{border-color:var(--ember)}
.fmc b{display:block;font-size:12.5px;color:var(--bone);font-weight:600;line-height:1.25}
.fmc span{font-size:11.5px;color:var(--ash)}
.fm.dead .fmc{opacity:.7}
.famTop{display:flex;gap:14px;align-items:center;margin-bottom:6px}
#famFace canvas{border:1px solid var(--ember);background:linear-gradient(#3a2e24,#241c16)}
#famSheet .sheet{max-height:88vh;overflow-y:auto}

/* ---------- shared ---------- */
.bar{display:flex;justify-content:space-between;align-items:center;padding-block:14px 6px}
.brand{font-family:var(--px);font-size:12px;letter-spacing:.12em;color:var(--ember)}
.lang{display:flex;border:1px solid var(--line)}
.lang select{background:var(--soot);border:0;padding:4px 8px;font:inherit;font-size:12px;color:var(--bone);appearance:auto}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lang button[aria-pressed="true"]{background:var(--char);color:var(--bone)}
.eyebrow{font-family:var(--px);font-size:11px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase;margin:0}
.block{padding-block:26px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.block h2{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.3}
.note{color:var(--ash);font-size:13.5px;margin:0}
.btn{display:block;width:100%;border:0;padding:14px 18px;font-weight:600;font-size:17px;border-radius:2px;letter-spacing:.01em}
.btn-primary{background:var(--ochre);color:#1a0d07;box-shadow:0 4px 0 var(--ochre-dk)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ochre-dk)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--bone)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px}

/* ---------- home ---------- */
.hero{padding-block:22px 28px;display:flex;flex-direction:column;gap:6px}
.counter{font-family:var(--display);font-weight:600;font-size:clamp(34px,10.5vw,50px);line-height:1.1;color:var(--bone);letter-spacing:-.01em}
.hero-sub{color:var(--ash);font-size:13.5px;margin:4px 0 0;max-width:60ch}
.since{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.since div{background:var(--soot);border:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.since span{font-size:12px;color:var(--ash);line-height:1.35}
.since b{font-family:var(--px);font-size:20px;font-weight:400;color:var(--ember)}
.since div:last-child b{color:var(--ash)}

.track{position:relative;height:48px;margin-top:6px}
.track .rail{position:absolute;left:0;right:0;top:22px;height:4px;background:var(--char)}
.track .fill{position:absolute;right:0;top:22px;height:4px;background:linear-gradient(90deg,transparent,var(--ochre))}
.track .tick{position:absolute;top:14px;width:2px;height:20px;background:var(--ash)}
.track .tick.hi{background:var(--ember);width:4px;top:10px;height:28px}
.track .lbl{position:absolute;top:36px;font-family:var(--px);font-size:9.5px;color:var(--ash);transform:translateX(-50%);white-space:nowrap}
.track .lbl.l{transform:none;left:0}
.track .lbl.r{transform:none;right:0}
.cal{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.cal li{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cal li b{font-family:var(--px);font-weight:400;font-size:12px;color:var(--ash);padding-top:2px}
.cal li.hi b,.cal li.hi span{color:var(--ember)}
.cal .pre{color:var(--ash);font-size:13px}

.chap{display:flex;flex-direction:column;gap:8px}
.ch{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start;padding:12px;background:var(--soot);border:1px solid var(--line)}
.ch.on{border-color:var(--ochre);background:linear-gradient(180deg,#2a1810,var(--soot))}
button.ch{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
button.ch:disabled{cursor:default}
.ch .pick{font-family:var(--px);font-size:9.5px;color:var(--ember);margin-left:6px;vertical-align:2px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:12px;color:var(--ash)}
.tools .tc{border:1px solid var(--line);background:var(--soot);padding:1px 8px;color:var(--bone);border-radius:2px}
.tools .tc.mam{border-color:var(--ochre);color:var(--ember)}
.ch.off{opacity:.55}
.ch .n{font-family:var(--px);font-size:22px;color:var(--ember);line-height:1}
.ch.off .n{color:var(--ash)}
.ch h3{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.3}
.ch p{margin:2px 0 0;font-size:13.5px;color:var(--ash)}
.ch .meta{font-family:var(--px);font-size:10px;color:var(--ash);letter-spacing:.04em;margin-top:6px}
.tag{display:inline-block;font-family:var(--px);font-size:9.5px;border:1px solid var(--line);padding:1px 6px;margin-left:6px;vertical-align:2px;color:var(--ash)}

.field{display:flex;flex-direction:column;gap:6px}
.field > span{font-size:13px;color:var(--ash)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;background:var(--soot);border:1px solid var(--line);padding:9px 10px;font-size:14px;border-radius:2px}
.seg button[aria-pressed="true"]{border-color:var(--ember);background:var(--char);color:var(--ember)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--soot);border:1px solid var(--line);padding:6px 10px;font-size:13px;border-radius:2px}
.chips button[aria-pressed="true"]{border-color:var(--ember);color:var(--ember)}
.warn{font-size:12.5px;color:var(--ash);margin:0;border-left:2px solid var(--line);padding-left:10px}

.past{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.past li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.past li .t{font-weight:600}
.past li .s{font-size:12.5px;color:var(--ash);grid-column:1/-1}
.past li .a{font-family:var(--px);font-size:12px;color:var(--ember);align-self:center}
.sources{padding-block:22px 40px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ash)}
.sources p{margin:0 0 8px}
.sources a{color:var(--ember)}

/* ---------- draw ---------- */
#draw{padding-block:18px 32px}
.roll{min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:left}
.roll .big{font-family:var(--display);font-weight:600;font-size:clamp(30px,9vw,42px);line-height:1.15}
.roll .sci{font-style:italic;color:var(--ash)}
canvas.scene{display:block;width:100%;height:auto;aspect-ratio:16/9;max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--void);border:1px solid var(--line)}
.rec{display:flex;flex-direction:column;margin:14px 0 18px}
.cun{font-family:'Noto Sans Cuneiform',serif;letter-spacing:.04em;line-height:1.3}
.rec .cun{font-size:18px;color:var(--ember)}
.seal8i{width:64px;height:64px;image-rendering:pixelated;margin:4px 0;border-radius:3px}
.seal8{display:flex;flex-direction:column;align-items:center;gap:6px}
.seal8 canvas{border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.hie{font-family:'Noto Sans Egyptian Hieroglyphs',serif;line-height:1.3}
.rec .hie{font-size:18px;color:var(--ember)}
#dCun.hie{font-size:28px}
.tab4 .hie{font-size:24px}
.tab4.pap6{background:#eadcb4;box-shadow:inset 0 0 0 2px #cdb98a;border-radius:3px 6px 4px 8px;background-image:repeating-linear-gradient(90deg,rgba(150,120,70,.08) 0 2px,transparent 2px 7px)}
#dCun{font-size:28px;color:var(--ember);margin:2px 0 6px;min-height:0}
.tab4{background:#c9b08a;color:#3a2a1c;border-radius:12px 16px 14px 18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 0 0 2px #b39466;margin:6px 0}
.tab4 .tl{display:flex;flex-direction:column;gap:1px}
.tab4 .cun{font-size:24px}
.tab4 i{font-size:12.5px;opacity:.75}
.tab4 .tl span:last-child{font-size:13.5px}
.rec div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rec dt,.rec .k{color:var(--ash);font-size:13px}
.rec .odds{font-family:var(--px);color:var(--ember);font-size:15px}
.blurb{font-size:14.5px;margin:0 0 6px}
.facts{margin:0 0 18px;padding-left:18px;color:var(--ash);font-size:13.5px}
.small{font-size:12px;color:var(--ash)}

/* ---------- play ---------- */
#play{padding-block:0 calc(env(safe-area-inset-bottom,0px) + 150px)}
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--night);display:flex;justify-content:space-between;align-items:end;padding-block:10px 8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.pbar .ag{display:flex;flex-direction:column}
.pbar .ag small,.pbar .ck small{font-size:11px;color:var(--ash)}
.pbar .ag b{font-family:var(--px);font-weight:400;font-size:26px;line-height:1;color:var(--bone)}
.pbar .ag i{font-style:normal;font-size:12px;color:var(--ash)}
.pbar .ck{text-align:right;display:flex;flex-direction:column}
.pbar .ck b{font-family:var(--px);font-weight:400;font-size:15px;color:var(--ember)}
body.playing::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.who{display:flex;justify-content:space-between;gap:10px;margin:8px 0 10px;font-size:13px;color:var(--ash)}
.who b{color:var(--bone);font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat .lb{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ash)}
.stat .lb b{font-family:var(--px);font-weight:400;font-size:11px;color:var(--bone)}
.meter{height:8px;background:var(--char);position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--good);transition:width .4s ease}
.meter i.mid{background:var(--warn)}
.meter i.low{background:var(--bad)}
.meter.sk i{background:var(--ember)}
.yearbar{height:3px;background:var(--char);margin:14px 0 8px}
.yearbar i{display:block;height:100%;width:0;background:var(--ochre)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.55}
.log li .a{font-family:var(--px);font-size:11px;color:var(--ash);padding-top:3px}
.log li.big{color:var(--ember)}
.log li.sad{color:#d9c9b9}
.log li.lg{color:var(--myth);font-style:italic}
.log li.lg small{border-left-color:var(--myth);font-style:normal}
.log li.cl{color:#b9cdd6}
.chip{display:inline-block;font-size:12px;border:1px solid var(--ochre);color:var(--ember);padding:1px 8px;border-radius:2px;line-height:1.5}
.stat.wide{grid-column:1/-1}
.meter.pr i{background:var(--ochre)}
.who{flex-wrap:wrap}
.who .cli{flex-basis:100%;font-size:12px;color:#b9cdd6}
.path{font-size:13px;color:var(--ash)}
.log li small{display:block;margin-top:4px;font-size:12.5px;color:var(--ash);border-left:2px solid var(--line);padding-left:8px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(0deg,var(--night) 82%,transparent);
  padding:18px max(16px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px, env(safe-area-inset-left,0px))}
.dock-in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock .fl{font-size:12px;color:var(--ash)}
.focus{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.focus button{background:var(--soot);border:1px solid var(--line);padding:9px 4px;font-size:13px;line-height:1.25;border-radius:2px;min-height:48px}
.focus button[aria-pressed="true"]{border-color:var(--ochre);background:#2c1810;color:var(--ember)}
.focus button:disabled{opacity:.45;cursor:default}
.ctrl{display:flex;gap:6px;align-items:center}
.ctrl button{background:none;border:1px solid var(--line);padding:6px 10px;font-family:var(--px);font-size:11px;border-radius:2px;color:var(--ash)}
.ctrl button[aria-pressed="true"]{color:var(--ember);border-color:var(--ember)}
.ctrl .sp{flex:1}
.babynote{grid-column:1/-1;font-size:13px;color:var(--ash);padding:12px;border:1px dashed var(--line);text-align:center}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,3,2,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--soot);border-top:2px solid var(--ochre);
  padding:22px max(18px, env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(18px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;max-height:88%;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--display);font-weight:600;font-size:22px}
.sheet p{margin:0}
.sheet .fact{font-size:13px;color:var(--ash);border-left:2px solid var(--ochre);padding-left:10px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opts button{text-align:left;background:var(--char);border:1px solid var(--line);padding:12px 14px;font-size:15px;border-radius:2px}
.opts button:hover{border-color:var(--ember)}
.opts button.primary{background:var(--ochre);color:#1a0d07;border-color:var(--ochre);font-weight:600;text-align:center}
textarea{width:100%;box-sizing:border-box;background:var(--night);border:1px solid var(--line);color:var(--bone);font:inherit;font-size:15px;padding:10px;min-height:84px;border-radius:2px;resize:vertical}

/* ---------- death ---------- */
#death{padding-block:22px 48px;display:flex;flex-direction:column;gap:14px}
#death h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,8vw,38px);line-height:1.2}
.dline{color:var(--ash);margin:0}
.cardimg{width:100%;max-width:100%;border:1px solid var(--line);display:block}
.epi{font-family:var(--display);font-size:18px;line-height:1.6;margin:0;border-left:3px solid var(--ochre);padding-left:14px}
.clockline{font-family:var(--px);font-size:13px;color:var(--ember);line-height:1.6}
.ms{list-style:none;margin:0;padding:0}
.ms li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ms li b{font-family:var(--px);font-weight:400;font-size:11px;color:var(--ash);padding-top:3px}
.sharetext{font-size:13px;min-height:70px;color:var(--ash)}
.chgroup{font-family:var(--px);font-size:11px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase;margin:12px 0 0}
.ms.lin li{grid-template-columns:68px 1fr}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badges span{font-size:12px;border:1px solid var(--ochre);color:var(--ember);padding:1px 8px;border-radius:2px}
#linOpts button .small{display:block;margin-top:2px}
.skills{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.sk{display:flex;flex-direction:column;gap:2px;font-size:10.5px;color:var(--ash);min-width:0}
.sk .lb{display:flex;justify-content:space-between;gap:2px}
.sk b{font-family:var(--px);font-weight:400;font-size:10px;color:var(--bone)}
.sk .bar{height:4px;background:var(--char);position:relative;overflow:hidden}
.sk .bar i{position:absolute;inset:0 auto 0 0;background:var(--ember)}
.chip.tal{border-color:#7a8a5a;color:#c3d39a}
.chip.yt{border-color:var(--line);color:var(--ash)}
.chip.sick{border-color:var(--bad);color:#f0a08c}
.tools .tc.fr{border-color:#5a7a8a;color:#a9c4d0}
.tools .tc.it{border-color:#6b5a48}
.log li.it{color:var(--ash);font-size:13.5px}
.log li.wx{color:#c6d3dc}
.opts button:disabled{opacity:.45;cursor:default}
.opts button .req{display:block;font-size:12px;color:var(--ash);margin-top:2px}

  if(S.ch===5){if(S.rank>=3)return X('อาริกิ ผู้นำของทั้งเกาะ','ariki, high chief of the island');if(S.rank===2)return X('หัวหน้าหมู่บ้าน','village chief');if(S.spirit===1)return X('ผู้นำพิธีของหมู่บ้าน','the village’s ritual leader');

function learnTech(){
  const av=Object.keys(TECH).filter(k=>!S.tech[k]&&(!TECH[k].ch||TECH[k].ch===S.ch)&&(S.sp.id==='sap'||k==='blade')&&TECH[k].av(S));if(!av.length)return;
  const avm=av.filter(k=>TECH[k].act.includes(S.focus));let k=null;
  if(avm.length&&rnd()<(.09+(S.cr+S.kn)/1500+(S.role==='maker'?.06:0)+(hasT('curious')?.04:0))*(S.ch===5?.75:1))k=pick(avm);else if(rnd()<.012)k=pick(av);
  if(!k)return;const T=TECH[k];S.tech[k]=1;const first=rnd()<.15+(S.role==='maker'?.2:0);
  fx({p:first?6:2,kn:2});const key=first?'firstInvent':'learned';
  log(X(LANG.th[key].replace('{t}',T.n.th),LANG.en[key].replace('{t}',T.n.en)),T.note,'big');
  if(first)ms(X('คนแรกในกลุ่มที่ทำ'+T.n.th+'ได้','First in the band to make '+T.n.en));
}

/* offer 4 activities per year */
function actWeights(){const w={};const a=S.age;
  for(const id in ACTS){const A=ACTS[id];if(a<A.min)continue;if(A.cond&&!A.cond(S))continue;if(S.ch===4&&!ACT4.includes(id))continue;if(S.ch===6&&!ACT6.includes(id))continue;if(S.ch===8&&!ACT8.includes(id))continue;let x=1;
    if(S.ch===8){if(id==='herd'||id==='sow')x*=1.6;if(id==='school')x*=3;if(id==='write')x*=1.6;if(id==='temple')x*=1.2;if(id==='fish'&&['moh','lot'].includes(S.rg))x*=1.4}
    if(S.ch===6){if(id==='herd'||id==='sow')x*=1.6;if(id==='school')x*=3.5;if(id==='write'||id==='read')x*=1.6;if(id==='brew'&&S.sex==='f')x*=1.4;if(id==='marsh'&&['del','fay'].includes(S.rg))x*=1.5}
    if(S.ch===4){if(id==='herd'||id==='sow')x*=1.6;if(id==='school')x*=3.5;if(id==='write'||id==='read')x*=1.6;if(id==='brew'&&S.sex==='f')x*=1.4}
    const fam=A.fam;
    if(S.yt==='dry'){if(id==='hunt')x*=1.6;if(id==='gather')x*=.8}
    if(S.yt==='wet'){if(id==='gather'||id==='fish')x*=1.5}
    if(S.yt==='cold'||S.R.cold>=2){if(id==='sew'||id==='build')x*=2;if(id==='story')x*=1.4;if(id==='gather'||id==='herb')x*=.5}
    if(S.yt==='good'){if(id==='orn'||id==='trade'||id==='story')x*=1.5}
    if(fam==='forage'&&id!=='explore'&&id!=='run'){if(S.f<25)x*=4;else if(S.f<40)x*=2.5}
    if(S.h<45){if(id==='rest')x*=4;if(id==='herb')x*=2}
    if(S.sick&&(id==='rest'||id==='herb'))x*=3;
    if(S.b<40&&(id==='story'||id==='child'||id==='trade'))x*=2;
    if(S.kids.some(k=>!k.dead&&a-k.born<6)&&id==='child')x*=1.8;
    if(invCount()>=2&&id==='trade')x*=2;if(!invCount()&&id==='trade')x*=.5;
    for(const t of S.tal)if(TALENTS[t].acts.includes(id))x*=1.6;
    if(S.role&&roleFams(S)[S.role].includes(id))x*=1.5;
    if(id==='ritual'&&S.spirit>0)x*=2;
    if(S.car&&id===carAct(S))x*=2.5;
    if(S.ch===3){if(id==='herd')x*=2.2;if(id==='sow')x*=2.2;if(id==='tame'&&S.pen)x*=3;if(id==='tame'&&S.tamePass!=null&&S.age-S.tamePass<4)x*=.2}
    if(id==='rest'&&S.h>70)x*=.15;

{a:[15,55],w:1.4,ch:1,rg:['eur'],sp:['nea'],once:1,x:X('ทั้งกลุ่มช่วยกันล้มช้างงาตรงตัวใหญ่ เนื้อพอกินหลายสัปดาห์','The whole band brings down a straight-tusked elephant. There is meat for weeks.'),fx:{f:22,b:5,h:-5,p:4},n:X('หลักฐานที่นอยมาร์ค-นอร์ด เยอรมนี บอกว่านีแอนเดอร์ทัลล่าช้างงาตรงเมื่อราว 125,000 ปีก่อน','Finds at Neumark-Nord, Germany, show Neanderthals hunting straight-tusked elephants about 125,000 years ago.')},
{a:[12,70],w:1.4,sp:['nea'],once:1,x:X('ต้มเปลือกต้นเบิร์ชจนได้ยางเหนียว ใช้ติดหินกับด้ามไม้','You heat birch bark into sticky tar and use it to fix stone to a wooden handle.'),fx:{s:7,p:2},n:X('ยางเบิร์ชเป็นกาวที่มนุษย์ทำขึ้นเองเก่าแก่ที่สุดที่รู้จัก และนีแอนเดอร์ทัลทำได้','Birch tar is the oldest known human-made glue, and Neanderthals made it.')},
{a:[5,80],w:1.5,cold:1,x:X('หิมะตกหนัก ทุกคนต้องอยู่ในที่พักหลายสัปดาห์','Heavy snow. Everyone stays in shelter for weeks.'),fx:{f:-8,h:-4}},
{a:[5,80],w:1.3,rg:['tib'],once:1,x:X('อากาศบนที่สูงเบาบาง แต่ร่างกายคุณคุ้นกับมัน','The air up high is thin, but your body is used to it.'),fx:{h:4},n:X('ชาวทิเบตปัจจุบันมียีน EPAS1 ที่ช่วยให้อยู่บนที่สูงได้ ยีนนี้สืบมาจากเดนิโซแวน','Many Tibetans today carry an EPAS1 gene variant that helps at high altitude. It came from Denisovans.')},
{a:[5,80],w:1.3,rg:['alt'],once:1,x:X('กลุ่มไปพักในถ้ำใหญ่ริมแม่น้ำ ที่มีร่องรอยคนอื่นเคยมาใช้','The band shelters in a big riverside cave with signs that others used it before.'),fx:{b:3,h:2},n:X('ถ้ำเดนิโซวาถูกใช้ทั้งโดยเดนิโซแวนและนีแอนเดอร์ทัลมานานหลายแสนปี','Denisova Cave was used by both Denisovans and Neanderthals over hundreds of thousands of years.')},
{a:[8,70],w:2,rg:['jav'],f:'forage',x:X('จับปลาและหอยน้ำจืดในแม่น้ำโซโล','You catch fish and freshwater mussels in the Solo River.'),fx:{f:10}},
{a:[5,80],w:1.2,rg:['jav'],x:X('น้ำป่าไหลหลากท่วมริมตลิ่ง กลุ่มต้องหนีขึ้นที่สูง','A flash flood swamps the riverbank. The band flees to high ground.'),fx:{h:-8,f:-6},n:X('ฟอสซิลที่งันดงถูกกระแสน้ำพัดมากองรวมกันในชั้นตะกอนแม่น้ำ','The Ngandong fossils were washed together into river sediments.')},
{a:[13,55],w:1.6,rg:['flo'],once:1,f:'forage',x:X('ช่วยกันล่าลูกสเตโกดอนแคระ ญาติตัวเล็กของช้าง','The band hunts a young dwarf Stegodon, a small relative of elephants.'),fx:{f:16,p:3},n:X('กระดูกสเตโกดอนแคระพบร่วมกับเครื่องมือหินในถ้ำเหลียงบัว','Dwarf Stegodon bones were found with stone tools at Liang Bua.')},
{a:[5,80],w:1.4,rg:['flo'],once:1,x:X('เห็นนกกระสาตัวสูงเกือบเท่าคุณ เดินอยู่ริมน้ำ','You see a stork nearly as tall as you, walking by the water.'),n:X('ฟลอเรสเคยมีนกกระสายักษ์สูงราว 1.8 เมตร','Flores once had a giant stork about 1.8 m tall.')},
{a:[8,70],w:1.6,rg:['flo'],f:'forage',x:X('จับหนูตัวใหญ่ขนาดเกือบเท่าแมว','You catch a rat almost the size of a cat.'),fx:{f:6}},
{a:[8,70],w:2,rg:['luz'],f:'forage',x:X('ตามรอยกวางเข้าไปในป่าลึก','You track a deer deep into the forest.'),fx:{f:9}},
{a:[3,80],w:1.4,rg:['luz'],once:1,x:X('หลบฝนพายุในถ้ำหินปูนหลายวัน','You shelter from a storm in a limestone cave for days.'),fx:{h:3},n:X('ฟันและกระดูกของ H. luzonensis พบในถ้ำคาลเลา ทางเหนือของลูซอน','The teeth and bones of H. luzonensis were found in Callao Cave, northern Luzon.')},
{a:[8,70],w:2,rg:['sun'],f:'forage',x:X('เก็บผลไม้ป่า หน่อไม้ และขุดหัวมันในป่าดิบชื้น','You gather wild fruit, bamboo shoots and yams in the rainforest.'),fx:{f:9}},
{a:[8,70],w:1.6,ch:1,rg:['sah'],once:1,x:X('เห็นสัตว์มีกระเป๋าหน้าท้องตัวใหญ่เท่าฮิปโป กินหญ้าอยู่ริมบึง','You see a pouched animal as big as a hippo grazing by a swamp.'),n:X('สัตว์ตัวนั้นคือไดโปรโตดอน สัตว์มีกระเป๋าหน้าท้องที่ใหญ่ที่สุดที่เคยมีมา','That animal is Diprotodon, the largest marsupial that ever lived.')},
{a:[8,70],w:1.6,ch:1,rg:['sah'],once:1,f:'forage',x:X('เก็บไข่ใบใหญ่ของนกยักษ์ที่บินไม่ได้','You collect huge eggs from a giant flightless bird.'),fx:{f:10},n:X('ซาฮูลเคยมีนกยักษ์เจนยอร์นิส ซึ่งสูญพันธุ์ไปหลังมนุษย์มาถึงไม่นาน','Sahul had the giant bird Genyornis, which died out not long after people arrived.')},
{a:[8,70],w:1.4,rg:['ara'],once:1,x:X('เดินตามทะเลสาบกลางทะเลทราย ที่ฝูงนกน้ำมาหากินเต็มไปหมด','You follow a chain of lakes across the desert, crowded with water birds.'),fx:{f:6},n:RNOTE.ara},
{a:[8,70],w:1.4,rg:['sas'],once:1,x:X('ฝนมรสุมมาตรงเวลา แม่น้ำเอ่อล้น ปลาชุกชุม','The monsoon arrives on time. The river floods and fish are everywhere.'),fx:{f:9}},
// ---- chapter 2: mammoth hunters ----
{a:[12,60],w:1.4,ch:2,rg:['eur','wcv'],once:1,x:X('คุณเจาะรูกระดูกปีกนกแร้ง เป่าแล้วมีเสียงเหมือนลมร้องเพลง','You bore holes in a vulture wing bone. When you blow, it sings like the wind.'),fx:{b:5,p:3},n:X('ขลุ่ยกระดูกนกแร้งจากถ้ำโฮเลอเฟลส์ เยอรมนี อายุราว 40,000 ปี เป็นเครื่องดนตรีเก่าแก่ที่สุดชิ้นหนึ่งที่รู้จัก','A vulture-bone flute from Hohle Fels, Germany, about 40,000 years old, is one of the oldest known musical instruments.')},
{a:[12,60],w:1.3,ch:2,rg:['eur','mst','wcv'],once:1,f:'learn',x:X('คุณแกะงาแมมมอธเป็นรูปม้าตัวเล็กพอดีฝ่ามือ','You carve a palm-sized horse from mammoth ivory.'),fx:{s:4,p:3},n:X('รูปแกะงาแมมมอธจากถ้ำในเยอรมนีตอนใต้ เช่น ม้าจากโฟเกิลแฮร์ด มีอายุราว 35,000–40,000 ปี','Ivory carvings from caves in southern Germany, such as the Vogelherd horse, are about 35,000–40,000 years old.')},
{a:[12,60],w:1.2,ch:2,rg:['eur','mst'],once:1,cond:S=>S.ya<=27000,x:X('คุณปั้นดินเหนียวเป็นรูปคนแล้ววางไว้ในกองไฟ ตอนเช้ามันแข็งเหมือนหิน','You shape clay into a figure and set it in the fire. By morning it is hard as stone.'),fx:{s:3,p:3},n:X('รูปปั้นดินเผาที่ดอล์นีเวสโตนิตเซ สาธารณรัฐเช็ก อายุราว 26,000 ปี เป็นเครื่องดินเผาที่เก่าแก่ที่สุดที่รู้จัก','Fired clay figures from Dolní Věstonice, Czech Republic, about 26,000 years old, are the oldest known fired ceramics.')},
{a:[3,80],w:1.8,ch:2,cold:1,cond:S=>climate(S.ya).k==='lgm',x:X('ธารน้ำแข็งทางเหนือรุกลงมาใกล้ขึ้นทุกปี ฝูงสัตว์อพยพลงใต้ไปก่อนแล้ว','The northern ice creeps closer every year. The herds have already gone south.'),fx:{f:-10,h:-3},c:'cl'},
{a:[3,80],w:1.6,ch:2,once:1,cond:S=>climate(S.ya).k==='warm2'&&S.R.mam,x:X('น้ำแข็งละลาย แม่น้ำเอ่อล้น ป่าขึ้นแทนทุ่งหญ้าที่ฝูงแมมมอธเคยกิน','The ice melts, rivers swell, and forest grows over the grass the mammoths used to eat.'),c:'cl'},
{a:[10,80],w:1.6,ch:2,once:1,cond:S=>S.R.mam&&S.ya<13500,x:X('ไม่มีใครในกลุ่มเห็นแมมมอธมาหลายปีแล้ว เด็กๆ รู้จักมันจากเรื่องเล่าเท่านั้น','Nobody in the band has seen a mammoth in years. The children know them only from stories.'),c:'cl',n:X('แมมมอธหายไปจากแผ่นดินใหญ่ราว 10,000 ปีก่อน ทั้งจากภูมิอากาศที่เปลี่ยนและการล่าของมนุษย์ แต่ละสาเหตุมีส่วนมากแค่ไหนยังถกเถียงกันอยู่','Mammoths vanished from the mainland around 10,000 years ago, from both climate change and human hunting; how much each mattered is still debated.')},
{a:[8,70],w:1.2,ch:2,rg:['eur','mst','wcv','sib','ber'],x:X('สิงโตถ้ำตัวหนึ่งตามกลุ่มมาหลายคืน ไม่มีใครกล้าออกห่างกองไฟ','A cave lion stalks the band for nights. Nobody dares leave the fire.'),fx:{h:-3,b:3}},
{a:[14,55],w:1.4,ch:2,rg:['mst','sib','eur','eas'],f:'forage',x:X('ช่วยกันล้มแรดขนยาวที่ติดหิมะลึก','Together you bring down a woolly rhino stuck in deep snow.'),fx:{f:16,p:3}},
{a:[10,60],w:1.5,ch:2,rg:['wcv','eur','sib','ber'],f:'forage',x:X('ดักฝูงกวางเรนเดียร์ตรงจุดที่มันข้ามแม่น้ำทุกปี','You ambush the reindeer where they cross the river every year.'),fx:{f:14}},
{a:[10,60],w:1.4,ch:2,rg:['mst','eas','wcv'],f:'forage',x:X('ไล่ม้าป่าเข้าหุบแคบ ได้เนื้อพอกินทั้งเดือน','You drive wild horses into a narrow gully: meat for a month.'),fx:{f:12,p:1}},
{a:[6,60],w:1.3,ch:2,cond:S=>S.tech.needle&&S.R.cold,x:X('คุณเย็บชุดหนังขนสัตว์ให้เด็กๆ ในกลุ่ม ลมหนาวผ่านเข้าไม่ได้อีก','You sew fur clothes for the band’s children. The wind no longer gets through.'),fx:{b:4,h:3}},
{a:[14,60],w:1.2,ch:2,rg:['mst','eur','sib','eas'],once:1,x:X('คนจากที่ไกลเอาเปลือกหอยทะเลมาแลกหนังสัตว์ ทั้งที่ทะเลอยู่ห่างออกไปหลายร้อยกิโลเมตร','People from far away trade sea shells for hides, though the sea is hundreds of kilometres off.'),fx:{b:4,p:2},n:X('เปลือกหอยทะเลพบในแหล่งที่อยู่ลึกเข้าไปในแผ่นดินหลายร้อยกิโลเมตร บอกว่ามีเครือข่ายแลกเปลี่ยนที่กว้างมาก','Sea shells turn up hundreds of kilometres inland, a sign of very wide exchange networks.')},
{a:[14,60],w:1.6,ch:2,rg:['ame'],once:1,f:'learn',cond:S=>S.ya<=13100,x:X('คุณกะเทาะหัวหอกหินที่มีร่องยาวตรงกลาง เสียบด้ามได้แน่นกว่าเดิม','You flake a stone point with a long groove up its middle. It sits in the shaft tighter than ever.'),fx:{s:6,p:4},n:X('หัวหอกแบบนี้เรียกว่าโคลวิส พบทั่วอเมริกาเหนือ อายุราว 13,000 ปี','Points like this are called Clovis. They are found across North America and are about 13,000 years old.')},
{a:[10,60],w:1.3,ch:2,rg:['ame'],once:1,x:X('สลอธยักษ์ยืนสองขาขึ้นกินใบไม้ ตัวสูงกว่าต้นไม้เล็กๆ','A giant ground sloth rears up on two legs to eat leaves, taller than the young trees.'),n:X('สลอธยักษ์บางชนิดในอเมริกาตัวใหญ่ราวช้าง และสูญพันธุ์ไปหลังมนุษย์มาถึงไม่นาน','Some American giant ground sloths were as big as elephants and died out not long after people arrived.')},
{a:[5,60],w:1.3,ch:2,rg:['ber'],once:1,x:X('ทุ่งหญ้ากว้างสุดลูกหูลูกตา ผู้เฒ่าเล่าว่าทางตะวันออกมีแผ่นดินที่ยังไม่มีใครไปถึง','Grassland as far as the eye can see. The elders say there is land to the east that no one has reached.'),c:'cl'},
{a:[10,60],w:1.3,ch:2,rg:['eas'],once:1,x:X('คุณร้อยฟันสัตว์และเปลือกหอยเจาะรูเป็นสร้อย','You string drilled animal teeth and shells into a necklace.'),fx:{b:4,p:2},n:X('ถ้ำบนของโจวโข่วเตี้ยน ใกล้ปักกิ่ง มีเครื่องประดับและเข็มกระดูกจากปลายยุคน้ำแข็ง','The Upper Cave at Zhoukoudian near Beijing yielded ornaments and a bone needle from the late Ice Age.')},
{a:[8,70],w:1.4,ch:2,rg:['sah'],once:1,cond:S=>{S.hand=S.hand||'red';return true},x:X('คุณเป่าดินแดงพ่นรอบมือลงบนผนังหินใต้เพิงผา','You blow red ochre around your hand onto the rock wall under an overhang.'),fx:{b:4,p:3},n:X('ศิลปะบนหินของชาวอะบอริจินเป็นประเพณีศิลปะที่สืบต่อมายาวนานที่สุดแห่งหนึ่งของโลก','Aboriginal rock art is one of the longest continuous art traditions in the world.')},
{a:[8,70],w:1.3,ch:2,rg:['eaf','saf'],once:1,x:X('คุณเจาะเปลือกไข่นกกระจอกเทศทำเป็นลูกปัด แลกกับเพื่อนจากกลุ่มอื่น','You drill ostrich eggshell into beads and trade them with a friend from another band.'),fx:{b:5,p:2},n:X('ลูกปัดเปลือกไข่นกกระจอกเทศในแอฟริกามีอายุย้อนไปราว 50,000 ปี ใช้แลกเพื่อผูกสัมพันธ์ระหว่างกลุ่ม','Ostrich eggshell beads in Africa go back about 50,000 years and were exchanged to bind bands together.')},
// ---- Pacific voyagers ----
{a:[10,60],w:1.6,ch:5,rg:['bis','van','fij','ton'],once:1,cond:S=>S.ya>=2500,x:X('คุณกดแม่พิมพ์ซี่ฟันลงบนหม้อดินที่ยังไม่แห้ง เป็นลายจุดเรียงเป็นใบหน้า','You press a toothed stamp into wet clay, dotting a pattern into a face.'),fx:{s:4,p:2},n:X('เครื่องปั้นลาปิตามีลายกดเป็นจุดเรียงเป็นใบหน้าและลวดลาย พบตั้งแต่หมู่เกาะบิสมาร์กถึงซามัว ราว 3,300–2,500 ปีก่อน','Lapita pottery bears dentate-stamped faces and patterns, found from the Bismarcks to Samoa, about 3,300–2,500 years ago.')},
{a:[13,40],w:1.4,ch:5,once:1,x:X('ผู้อาวุโสเคาะหวีกระดูกจุ่มเขม่าลงบนผิวคุณ ลายสักบอกว่าคุณมาจากที่ไหน','An elder taps a soot-dipped bone comb into your skin. The tattoo tells where you come from.'),fx:{b:5,p:3,h:-3},n:X('คำว่า tattoo ในภาษาอังกฤษมาจากคำโพลินีเซีย tatau และนักโบราณคดีพบเครื่องมือที่น่าจะใช้สักในแหล่งลาปิตา','The English word tattoo comes from Polynesian tatau, and archaeologists have found probable tattooing tools at Lapita sites.')},
{a:[8,70],w:2,ch:5,f:'forage',x:X('ขุดเผือกจากสวนในบ่อโคลน ได้หัวใหญ่ทั้งแถว','You dig taro from the muddy pond gardens, a whole row of fat corms.'),fx:{f:10}},
{a:[8,70],w:1.5,ch:5,x:X('หมักสาเกเก็บไว้ในหลุมดิน กินได้ตลอดฤดูพายุ','You ferment breadfruit in an earth pit to last through storm season.'),fx:{f:7},n:X('สาเกหมักในหลุมดินเก็บได้นานหลายเดือนหรือเป็นปี เป็นเสบียงสำคัญทั้งบนเกาะและบนเรือ','Pit-fermented breadfruit keeps for months or years, a key store on land and at sea.')},
{a:[13,60],w:1.8,ch:5,f:'forage',x:X('ลากเบ็ดเปลือกหอยมุกตามหลังเรือ ได้ปลาทูน่าตัวใหญ่','You trail a pearl-shell lure behind the canoe and land a big tuna.'),fx:{f:12,p:2}},
{a:[16,70],w:1.4,ch:5,rg:['van','fij','ton'],x:X('คนในหมู่บ้านนั่งล้อมวงดื่มคาวา เสียงของทุกคนช้าลงและนุ่มลง','The village sits in a circle drinking kava. Every voice grows slow and soft.'),fx:{b:5},n:X('คาวาถูกนำมาปลูกครั้งแรกในวานูอาตู และใช้ในพิธีทั่วแปซิฟิกตะวันตก','Kava was first domesticated in Vanuatu and is drunk in ceremonies across the western Pacific.')},

/* decisions */
const opt=(l,run)=>({l,run});
const moveOpt=(rg)=>opt(REGIONS[rg].pac?X('ล่องเรือไปยัง'+REGIONS[rg].n.th,'Sail to '+REGIONS[rg].n.en):X('เดินไปยัง'+REGIONS[rg].n.th,'Walk to '+REGIONS[rg].n.en),S=>{
  if(REGIONS[rg].pac){if(rnd()<.18){fx({h:-14});S.yr+=.08;return X('เรือหลงทางกลางทะเลหลายสัปดาห์ แล้วต้องหันกลับมาที่เดิม','The canoe is lost at sea for weeks and has to turn back.')}
    fx({h:-6,f:8});moveTo(rg);return X('ทั้งหมู่บ้านลงเรือแคนูสองลำตัว แล่นตามดาวไปหลายวันจนเห็นเกาะที่ต้องการ','The village boards its double-hulled canoes and follows the stars for days until the island appears.')}
  if(rg==='ame'){fx({h:-8,f:10});moveTo(rg);ms(X('เดินเข้าสู่ทวีปอเมริกา','Walked into the Americas'));return X('ทั้งกลุ่มเดินตามชายฝั่งและฝูงสัตว์ลงใต้ไปเรื่อยๆ จนถึงดินแดนที่สัตว์ไม่รู้จักกลัวมนุษย์ เพราะไม่เคยเห็นมนุษย์มาก่อน','The band follows the coast and the herds south until they reach a land where animals have no fear of people, because they have never seen one.')}
  if(rg==='sah'){fx({h:-8});moveTo(rg);return X('ทั้งกลุ่มต่อแพจากไม้ไผ่ ข้ามทะเลไปทีละเกาะจนเห็นแผ่นดินใหญ่ที่ไม่มีมนุษย์คนใดเคยเหยียบ','The band lashes bamboo rafts and crosses the sea island by island, until a great land no human has ever walked appears.')}
  fx({f:14,h:-6,b:2});moveTo(rg);return X('เดินทางหลายเดือน ดินแดนใหม่ไม่มีใครรู้จัก แต่มีอาหาร','Months of walking. The new land is strange, but it has food.')});
const stayOpt=()=>opt(X('อยู่ที่เดิม อดทนต่อไป','Stay and endure'),S=>{fx({f:-4,b:3});return X('กลุ่มกินทุกอย่างที่หาได้ รากไม้ แมลง และหนังสัตว์ที่ต้มจนนิ่ม','The band eats whatever it can find: roots, insects, hides boiled soft.')});
const isleOpt=()=>opt(X('ข้ามภูเขาไปอีกฝั่งของเกาะ','Cross the mountains to the far side of the island'),S=>{fx({f:12,h:-6});ms(X('ย้ายไปอีกฝั่งของเกาะ','Moved to the far side of the island'));return X('อีกฝั่งของเกาะมีป่าที่ยังไม่มีใครแตะ','The far side of the island has untouched forest.')});
function moveOpts(S){let ns=(NEIGH[S.rg]||[]).filter(r=>valid(S.sp.id,r,S.ya)&&!linBlocked(S,r)&&(S.ch!==3||!!R3[r]));const back=S.path[S.path.length-2];if(ns.length>1)ns=ns.filter(r=>r!==back);
  const o=[];if(S.R.isle||!ns.length)o.push(isleOpt());else ns.sort(()=>rnd()-.5).slice(0,2).forEach(r=>o.push(moveOpt(r)));o.push(stayOpt());return o}

 o:[opt(X('สู้เพื่อรักษาตำแหน่ง','Fight to keep your place'),S=>{if(rnd()<(S.h>60?.65:.45)){fx({p:8,h:-8,b:-4});return X('คุณชนะ แต่ความเงียบหลังจากนั้นหนักกว่าทุกครั้ง','You win, but the silence afterward is heavier than ever.')}S.rank=1;fx({h:-22,p:-15});S.inj=1;ms(X('เสียตำแหน่งผู้นำหลังการต่อสู้','Lost the leadership in a fight'));return X('คุณแพ้ และต้องนั่งพักแผลอยู่หลายเดือน กลุ่มฟังเสียงคนอื่นแล้ว','You lose, and nurse your wounds for months. The band listens to someone else now.')}),
    opt(X('ให้ทุกคนตัดสินกันเอง','Let the band decide'),S=>{if(S.b>=60){fx({p:6,b:4});S.hard=0;return X('ทุกคนเลือกเดินตามคุณต่อ เสียงท้าทายเงียบลง','The band chooses to keep following you. The challenge fades.')}S.rank=1;fx({p:-8});ms(X('สละตำแหน่งผู้นำ','Stepped down as leader'));return X('กลุ่มเลือกเดินตามคนหนุ่ม คุณกลับไปเป็นคนธรรมดาอย่างสงบ','The band follows the young man. You become an ordinary member again, peacefully.')}),
    opt(X('ยกตำแหน่งให้อย่างเต็มใจ','Hand it over gladly'),S=>{S.rank=1;fx({b:8,p:-4});ms(X('ส่งต่อการนำให้คนรุ่นใหม่','Handed leadership to the young'));return X('คุณช่วยเขาอยู่ข้างๆ ทุกคนนับถือคุณมากขึ้นกว่าเดิม','You stand at his side. Everyone respects you more than before.')})]},
{id:'chief',xch:[5],a:[30,66],w:1.2,cond:S=>S.rank===2&&S.p>=84&&S.b>=55,t:X('การชุมนุมใหญ่','The great gathering'),
 x:X('หลายกลุ่มมาชุมนุมกันที่ริมน้ำใหญ่ในฤดูที่อาหารอุดม ผู้อาวุโสจากกลุ่มอื่นเริ่มมาถามความเห็นของคุณ','Many bands gather by the great water in the season of plenty. Elders from other bands come to ask what you think.'),
 n:X('การชุมนุมตามฤดูของหลายกลุ่มเป็นเรื่องที่พบในสังคมนักล่าหลายแห่ง เป็นเวลาของการแลกเปลี่ยนและหาคู่','Seasonal gatherings of many bands are found in many hunter-gatherer societies, a time to trade and find partners.'),
 o:[opt(X('ชวนทุกกลุ่มล่าสัตว์ครั้งใหญ่ร่วมกัน','Call all the bands to one great hunt'),S=>{S.rank=3;fx({f:18,p:12,b:4});ms(X('นำการล่าครั้งใหญ่ของหลายกลุ่ม','Led a great hunt of many bands'));return X('คนนับร้อยไล่ฝูงสัตว์พร้อมกัน เรื่องในวันนั้นถูกเล่าต่ออีกหลายรุ่น','Hundreds drive the herd together. The story of that day is told for generations.')}),
    opt(X('จับคู่แต่งงานข้ามกลุ่ม ให้ทุกกลุ่มเป็นญาติกัน','Arrange matches so every band becomes kin'),S=>{S.rank=3;fx({b:14,p:10});ms(X('เชื่อมหลายกลุ่มให้เป็นเครือญาติ','Bound many bands together as kin'));return X('จากนี้ไป ไม่ว่าคุณเดินไปทางไหน จะมีญาติรออยู่เสมอ','From now on, wherever you walk, there is kin waiting.')}),
    opt(X('กลับไปดูแลกลุ่มของตัวเอง','Go home to your own band'),S=>{fx({b:4});return X('คุณไม่ต้องการอะไรมากกว่ากลุ่มของตัวเอง','You want nothing more than your own band.')})]},
{id:'meet',deck:'adult',w:3,a:[20,44],rg:['lev','zag','alt','eur'],cond:S=>meetText(S)!=null,t:X('คนอีกแบบหนึ่ง','A different kind of people'),
 xf:S=>meetText(S),
 n:X('DNA บอกว่าเซเปียนส์ นีแอนเดอร์ทัล และเดนิโซแวนมีลูกด้วยกันหลายครั้ง','DNA shows sapiens, Neanderthals and Denisovans had children together many times.'),
 o:[opt(X('ยื่นอาหารให้','Offer food'),S=>{fx({b:6,f:-4,p:3});ms(X('พบมนุษย์อีกสายพันธุ์ และเลือกเป็นมิตร','Met another kind of human and chose friendship'));if(rnd()<.35&&S.age<42){S.mixed=1;addKid(true);return X('ทั้งสองกลุ่มพักใกล้กันทั้งฤดู ไม่นานต่อมา คุณมีลูกที่หน้าตาคล้ายทั้งสองกลุ่ม','The two bands camp side by side all season. Before long you have a child who looks like both peoples.')}return X('ทั้งสองกลุ่มพักใกล้กันทั้งฤดู แลกเครื่องมือหินกันไม่กี่ชิ้น','The two bands camp side by side all season and trade a few stone tools.')}),
    opt(X('หลบไปเงียบๆ','Slip away quietly'),S=>{fx({b:2});ms(X('พบมนุษย์อีกสายพันธุ์ และหลบไป','Met another kind of human and slipped away'));return X('พวกเขาไม่เห็นคุณ คุณเล่าเรื่องนี้ให้กลุ่มฟังอยู่หลายปี','They never see you. You tell the band about them for years.')}),
    opt(X('ขู่ไล่ไป','Drive them off'),S=>{ms(X('ปะทะกับมนุษย์อีกสายพันธุ์','Clashed with another kind of human'));if(rnd()<.35){fx({h:-18});S.inj=1;return X('มีการปะทะกัน คุณได้แผลกลับมา','There is a fight. You come back wounded.')}fx({p:4});return X('พวกเขาถอยกลับไปทางเดิม','They back away the way they came.')})]},
{id:'move',a:[22,50],w:.2,t:X('ผู้อาวุโสอยากย้ายถิ่น','The elders want to move'),
 xf:S=>S.R.isle?X('ป่าฝั่งนี้เหลือผลไม้และสัตว์น้อยลง ผู้อาวุโสเสนอให้ข้ามภูเขาไปอีกฝั่งของเกาะ','This side of the island has little left. The elders want to cross the mountains to the far side.'):X('ฝูงสัตว์เปลี่ยนเส้นทาง ผู้อาวุโสเสนอให้ทั้งกลุ่มเดินตามไปยังดินแดนที่ไม่มีใครในกลุ่มเคยไป','The herds have changed their routes. The elders want the band to follow them into land none of you has seen.'),
 of:moveOpts},
{id:'flee',rep:10,t:X('อาหารหมดแล้ว','The food is gone'),forced:1,
 xf:S=>X('หลายปีติดกันที่อาหารไม่พอ เด็กๆ ผอมลง กลุ่มต้องตัดสินใจว่าจะทำอย่างไร','Year after year there is not enough food. The children grow thin. The band must decide what to do.'),
 n:X('การขาดแคลนอาหารและการเปลี่ยนแปลงของภูมิอากาศ เป็นแรงผลักสำคัญที่ทำให้มนุษย์กระจายไปทั่วโลก','Food shortage and climate change were major forces that spread humans across the world.'),
 of:moveOpts},
{id:'care',deck:'adult',w:1.8,a:[20,44],t:X('คนบาดเจ็บสาหัส','A badly injured friend'),
 x:X('นักล่าคนหนึ่งตกหน้าผา แขนหักและเดินไม่ได้ เขาจะหาอาหารเองไม่ได้อีกนาน','A hunter falls from a cliff. His arm is broken and he cannot walk. He will not feed himself for a long time.'),
 nf:S=>S.sp.id==='nea'?X('ฟอสซิลชานิดาร์ 1 ในเทือกเขาซากรอส มีแผลและความพิการหลายแห่ง แต่อยู่ต่อได้หลายปี แปลว่ามีคนดูแล','The Shanidar 1 fossil from the Zagros had several injuries and disabilities yet lived on for years, which means others cared for him.'):null,
 o:[opt(X('แบ่งอาหารให้และดูแลเขา','Share food and care for him'),S=>{fx({b:12,f:-8,p:5});ms(X('ดูแลเพื่อนที่บาดเจ็บจนรอด','Cared for an injured friend until he recovered'));return X('เขารอดมาได้ และนั่งสอนเด็กๆ ทำเครื่องมืออยู่หลายปี','He survives, and spends years teaching children to make tools.')}),
    opt(X('ให้กลุ่มตัดสินใจกันเอง','Leave it to the band'),S=>{fx({b:-3});return X('กลุ่มเดินทางต่อช้าลง คุณไม่แน่ใจว่าตัวเองทำถูกไหม','The band moves on more slowly. You are not sure you did right.')})]},
{id:'elder',deck:'elder',w:2.5,a:[45,80],t:X('เด็กๆ มานั่งล้อมคุณ','The children gather round'),
 x:X('คุณเป็นคนอายุมากที่สุดคนหนึ่งในกลุ่ม เด็กๆ อยากรู้ว่าคุณจะเล่าอะไร','You are one of the oldest in the band. The children want to hear what you know.'),
 n:X('นักมานุษยวิทยาพบว่าคนอาวุโสช่วยให้หลานรอดมากขึ้น ทั้งด้วยอาหารและความรู้','Anthropologists find that elders help grandchildren survive, with both food and knowledge.'),
 o:[opt(X('สอนวิธีทำเครื่องมือหิน','Teach them to make stone tools'),S=>{fx({b:6,s:3,p:4});ms(X('ส่งต่อวิชาทำเครื่องมือให้รุ่นหลาน','Passed toolmaking on to the grandchildren'));return X('มือเล็กๆ ลองตีหินตามคุณจนนิ้วเลือดออก แต่พวกเขาจำได้','Small hands strike stone after you until their fingers bleed, but they remember.')}),
    opt(X('เล่าเรื่องดินแดนและฝูงสัตว์ที่เคยเห็น','Tell of the lands and herds you have seen'),S=>{fx({b:10,p:4});ms(X('เล่าเรื่องให้รุ่นหลานฟัง','Told the grandchildren the old stories'));return X('เรื่องของคุณจะถูกเล่าต่อไป หลังจากคุณไม่อยู่แล้ว','Your stories will be told after you are gone.')})]},
// ---- chapter 2 decisions ----
{id:'mam',ch:2,a:[15,58],w:3,rep:5,cond:S=>S.R.mam&&S.ya>=11000,t:X('ฝูงแมมมอธ','The mammoth herd'),
 xf:S=>S.rg==='ame'?X('ฝูงแมมมอธโคลัมเบียเดินลงมากินน้ำที่ลำธาร ตัวใหญ่ที่สุดสูงกว่าสี่เมตร','A herd of Columbian mammoths comes down to drink. The biggest stands over four metres tall.'):X('ฝูงแมมมอธขนยาวเดินผ่านทุ่งหญ้าใกล้ที่พัก นักล่าทุกคนหันมามองหน้ากัน','A herd of woolly mammoths crosses the grassland near camp. Every hunter looks at the others.'),
 n:X('แหล่งโบราณคดีในยุโรปตะวันออกและไซบีเรียมีกระดูกแมมมอธนับพันชิ้น บางชิ้นมีปลายอาวุธฝังอยู่ แต่นักวิทยาศาสตร์ยังถกเถียงว่ามนุษย์ล่าแมมมอธบ่อยแค่ไหน และเก็บจากซากที่ตายเองมากแค่ไหน','Sites in eastern Europe and Siberia hold thousands of mammoth bones, some with weapon tips lodged in them, but scientists still debate how often people hunted mammoths and how often they scavenged.'),
 of:S=>{const o=[opt(X('ต้อนตัวหนึ่งให้แยกจากฝูง แล้วรุมแทงด้วยหอก','Cut one from the herd and close in with spears'),S=>mamHunt(S,0))];
   if(S.tech.atlatl)o.push(opt(X('ใช้เครื่องพุ่งหอกจากระยะไกล','Use spear-throwers from a distance'),S=>mamHunt(S,1)));
   o.push(opt(X('รอแร้งวน แล้วไปหาซากแมมมอธที่ติดหนองตาย','Wait for the vultures, then look for a mammoth dead in the bog'),S=>{if(rnd()<.55){fx({f:14});return X('คุณเจอซากที่ยังสด ทั้งกลุ่มแล่เนื้อและเก็บงากลับมา','You find a fresh carcass. The band butchers it and carries off the tusks.')}fx({f:-2});return X('ซากที่เจอเน่าแล้ว และมีหมาป่าเฝ้าอยู่','The carcass you find has gone bad, and wolves are guarding it.')}));
   o.push(opt(X('ปล่อยไป ไปล่ากวางแทน','Let them go and hunt deer instead'),S=>{fx({f:8});return X('กวางตัวเล็กกว่า แต่ไม่มีใครต้องเสี่ยงตาย','Deer are smaller, but nobody has to risk their life.')}));return o}},
{id:'hut',ch:2,a:[16,60],w:4,rg:['mst','sib','eur','ber'],cond:S=>S.done.mam!=null&&!S.hut,t:X('บ้านจากกระดูก','A house of bones'),
 x:X('ทุ่งหญ้าไม่มีต้นไม้พอให้สร้างที่พัก แต่มีกระดูกแมมมอธกองอยู่ทุกที่ ผู้อาวุโสเสนอให้สร้างบ้านจากกระดูกและงา แล้วคลุมด้วยหนังสัตว์','The steppe has too few trees to build with, but mammoth bones lie everywhere. The elders want a house of bone and tusk, covered in hides.'),
 n:X('ที่เมซีริช ยูเครน พบบ้านกระดูกแมมมอธอายุราว 15,000 ปี ใช้กระดูกหลายร้อยชิ้น และที่คอสเตนกี รัสเซีย มีวงกระดูกแมมมอธที่เก่ากว่านั้นอีก','At Mezhyrich, Ukraine, mammoth-bone dwellings about 15,000 years old used hundreds of bones; an older ring of mammoth bones is known at Kostenki, Russia.'),
 o:[opt(X('ช่วยกันสร้างทั้งฤดู','Build it together all season'),S=>{S.hut=1;fx({b:8,h:4,p:4});ms(X('สร้างบ้านกระดูกแมมมอธ','Built a mammoth-bone house'));return X('กรามแมมมอธเรียงเป็นกำแพง งาโค้งเป็นประตู ข้างในอุ่นกว่าที่ไหนที่ใครเคยนอนมา','Mammoth jaws stacked into walls, a curved tusk for a doorway. Inside it is warmer than anywhere anyone has slept.')}),
    opt(X('ใช้เพิงหนังสัตว์เหมือนเดิม','Keep the old hide tents'),S=>{fx({f:3});return X('เพิงหนังสัตว์ย้ายตามฝูงสัตว์ได้ง่ายกว่า','Hide tents are easier to move after the herds.')})]},
{id:'art',ch:2,a:[14,60],w:2.5,rg:['wcv','eur','mst'],sp:['sap'],t:X('ผนังถ้ำในความมืด','The cave wall in the dark'),
 xf:S=>S.tech.lamp?X('คุณถือตะเกียงไขมันลึกเข้าไปในถ้ำ แสงสั่นไหวทำให้ผนังหินดูเหมือนมีสัตว์ซ่อนอยู่','You carry a fat lamp deep into the cave. The flicker makes the rock look as if animals hide in it.'):X('ปากถ้ำมีผนังหินเรียบ ในมือคุณมีถ่านกับดินแดง','At the cave mouth is a smooth rock wall. In your hands are charcoal and red ochre.'),
 n:X('ภาพวาดในถ้ำโชเวต์ ฝรั่งเศส มีอายุราว 36,000 ปี ถ้ำลาสโกราว 17,000 ปี และรอยมือพ่นสีพบในถ้ำทั่วโลก','The paintings of Chauvet Cave, France, are about 36,000 years old, Lascaux about 17,000, and stencilled hands are found in caves worldwide.'),
 o:[opt(X('วาดฝูงม้าและแมมมอธที่วิ่งข้ามผนัง','Paint horses and mammoths running across the wall'),S=>{fx({p:8,b:5,s:3});S.art=1;ms(X('วาดภาพสัตว์บนผนังถ้ำ','Painted animals on a cave wall'));return X('เมื่อเปลวไฟสั่น สัตว์บนผนังเหมือนกำลังวิ่ง เด็กๆ ไม่กล้าละสายตา','When the flame trembles, the animals seem to run. The children cannot look away.')}),
    opt(X('พ่นดินแดงรอบมือตัวเองไว้บนหิน','Blow red ochre around your own hand on the stone'),S=>{fx({p:4,b:4});S.art=1;S.hand=S.hand||'red';ms(X('ทิ้งรอยมือไว้บนผนังถ้ำ','Left a handprint on a cave wall'));return X('รอยมือของคุณจะอยู่บนผนังนั้นนานกว่าชื่อของทุกคนในกลุ่ม','Your handprint will outlast every name in the band.')}),
    opt(X('ไม่วาด รีบออกจากความมืด','Do not paint; leave the dark quickly'),S=>X('ในถ้ำเงียบจนได้ยินเสียงหัวใจตัวเอง คุณรีบเดินออกมาหาแสง','The cave is so quiet you can hear your own heart. You hurry back to the light.'))]},
{id:'wolf',ch:2,a:[10,50],w:2,cond:S=>S.ya<=20000&&!S.dog&&S.R.cold,t:X('ลูกหมาป่าหลงฝูง','A lost wolf pup'),
 x:X('คุณเจอลูกหมาป่าตัวเล็กร้องอยู่ใกล้ที่พัก แม่ของมันไม่กลับมาอีกแล้ว','You find a small wolf pup whimpering near camp. Its mother is not coming back.'),
 n:X('การเลี้ยงสุนัขเกิดขึ้นในยุคน้ำแข็ง ช่วงเวลาที่แน่ชัดยังถกเถียง หลุมศพที่บอนน์-โอเบอร์คาสเซิล เยอรมนี อายุราว 14,000 ปี มีสุนัขฝังไว้ข้างมนุษย์','Dogs were domesticated during the Ice Age; exactly when is debated. A grave at Bonn-Oberkassel, Germany, about 14,000 years old, holds a dog buried beside people.'),
 o:[opt(X('เลี้ยงไว้ ให้กินเศษเนื้อ','Keep it and feed it scraps'),S=>{S.dog=1;fx({b:4});ms(X('เลี้ยงหมาป่าจนเชื่อง','Raised a wolf until it was tame'));return X('มันโตขึ้นและเดินตามคุณทุกที่ เวลาออกล่า มันได้กลิ่นสัตว์ก่อนใคร','It grows up and follows you everywhere. On the hunt it smells the game before anyone.')}),
    opt(X('ปล่อยมันไว้','Leave it'),S=>X('คืนนั้นคุณยังได้ยินเสียงมันร้องอยู่นาน','That night you hear it crying for a long time.'))]},
{id:'east',ch:2,a:[16,55],w:3,rg:['ber'],cond:S=>valid(S.sp.id,'ame',S.ya),t:X('ดินแดนทางตะวันออก','The land to the east'),
 x:X('นักล่าที่ตามฝูงสัตว์ไปไกลที่สุดกลับมาเล่าว่า เลยแนวน้ำแข็งไปตามชายฝั่ง มีแผ่นดินที่ไม่มีกองไฟของใครเลย','The hunter who followed the herds farthest comes back saying that past the ice, along the coast, lies land where no one’s fire burns.'),
 n:RNOTE.ame,

function scoutOpts(S){return moveOpts(S).filter(o=>o)}
function fwd(S){const i=PAC.indexOf(S.rg);return (NEIGH[S.rg]||[]).filter(r=>PAC.indexOf(r)>i&&valid(S.sp.id,r,S.ya)&&!S.path.includes(r))}
function voyage(S){const f=fwd(S);const kn=['star','swell','bird','cloud','vaka','sail'].filter(k=>S.tech[k]).length;
  const p=.25+(S.tr+S.kn)/800+kn*.06+(S.role==='scout'?.12:S.role==='teller'?.05:0)+(S.rank>=2?.05:0)+(S.wait?.12:0);S.wait=0;
  if(!f.length){fx({h:-6,f:-4,p:2});return X('สามสิบวันกลางทะเล ไม่มีนก ไม่มีเมฆลอยนิ่ง ไม่มีแผ่นดิน เรือหันกลับบ้านตอนน้ำจืดเหลือครึ่งเดียว','Thirty days at sea: no birds, no still clouds, no land. The canoe turns home with half its water left.')}
  if(rnd()<p){const r=pick(f);fx({p:12,b:4,h:-4});moveTo(r);ms(X('ค้นพบและตั้งถิ่นฐานที่'+REGIONS[r].n.th,'Discovered and settled '+REGIONS[r].n.en));
    return X('ในเช้าวันที่ยี่สิบสาม นกทะเลบินผ่านหัวเรือ ตามด้วยเมฆที่ลอยนิ่งอยู่ที่ขอบฟ้า บ่ายวันนั้นคุณเหยียบชายหาดที่ไม่เคยมีมนุษย์คนใดเหยียบมาก่อน','On the twenty-third morning seabirds pass the bow, then a cloud that will not move sits on the horizon. That afternoon you step onto a beach no human has ever touched.')}
  if(rnd()<.35){fx({h:-20});S.yr+=.12;S.inj=1;return X('พายุฉีกใบเรือ ทุกคนวิดน้ำทั้งคืน เรือรอดกลับมาได้อย่างหวุดหวิด','A storm tears the sail. Everyone bails all night. The canoe barely makes it home.')}
  fx({h:-6,f:-4});return X('ลมไม่เป็นใจ เรือหันกลับก่อนน้ำจืดจะหมด','The wind is against you. The canoe turns back before the water runs out.')}
function funNote(S){const id=S.sp.id,r=S.rg;
  if(S.ch===6)return fun6Note(S);
  if(S.ch===8)return fun8Note(S);
  if(S.ch===4)return fun4Note(S);
  if(S.ch===3)return fun3Note(S);
  if(['ere','flo','luz','den'].includes(id))return X('ยังไม่มีหลักฐานชัดเจนว่าสายพันธุ์นี้ทำอะไรกับผู้ตาย ภาพในเกมเป็นการจำลอง','There is no clear evidence of what this species did for its dead; this is a simulation.');
  if(id==='nea')return X('นีแอนเดอร์ทัลฝังศพในหลายแหล่ง เช่น ลาชาแปล-โอ-แซ็ง ฝรั่งเศส และถ้ำชานิดาร์ อิรัก แต่รายละเอียดอย่างการวางดอกไม้ยังถกเถียงกันอยู่','Neanderthals buried their dead at several sites, such as La Chapelle-aux-Saints in France and Shanidar Cave in Iraq, though details like flowers in graves are still debated.');
  if(S.ch===5)return X('ที่เตโอมา วานูอาตู ชาวลาปิตาฝังศพแล้วกลับมานำกะโหลกออกไปเก็บหรือฝังใหม่ภายหลัง ส่วนตำนานโพลินีเซียเล่าว่าวิญญาณเดินทางกลับไปยังบ้านเกิดของบรรพบุรุษ','At Teouma in Vanuatu, Lapita people buried their dead and later returned to remove or rebury the skulls. Polynesian tradition tells that the spirit journeys back to the ancestors’ homeland.');
  if(r==='sah')return X('ที่ทะเลสาบมังโก ออสเตรเลีย อายุราว 40,000 ปี พบร่างที่ถูกโรยดินแดง และร่างที่ถูกเผา ซึ่งเป็นการเผาศพที่เก่าที่สุดเท่าที่รู้','At Lake Mungo, Australia, about 40,000 years ago, one body was covered in red ochre and another was cremated, the oldest cremation known.');
  if(S.ch===2&&['mst','eur','wcv','sib'].includes(r))return X('ที่ซุงกีร์ รัสเซีย อายุราว 34,000 ปี มีหลุมศพที่ร่างถูกปักด้วยลูกปัดงาแมมมอธหลายพันเม็ด','At Sungir, Russia, about 34,000 years ago, bodies were buried sewn with thousands of mammoth-ivory beads.');
  if(r==='eaf')return X('หลุมศพเด็กที่ปังกายาไซดี เคนยา ที่นักวิจัยเรียกว่า "มโตโต" อายุราว 78,000 ปี เป็นการฝังศพที่เก่าที่สุดที่รู้จักในแอฟริกา','The child grave at Panga ya Saidi, Kenya, which researchers call “Mtoto”, is about 78,000 years old, the oldest known burial in Africa.');
  return X('หลุมศพที่ถ้ำกาฟเซห์และสคูล อิสราเอล อายุราว 100,000 ปี เป็นหลักฐานการฝังศพที่เก่าที่สุดชุดหนึ่ง เด็กคนหนึ่งที่กาฟเซห์ถูกฝังพร้อมเขากวาง','The graves at Qafzeh and Skhul, Israel, about 100,000 years old, are among the oldest burials known; a child at Qafzeh was buried with deer antlers.')}
function funOpts(S){const id=S.sp.id,o=[];const lead=S.spirit>0?2:0;
  const done=(t,f)=>S=>{fx(f);if(S.spirit>0)fx({p:3});return t};
  if(S.ch===6){fun6Opts(S,o,done,lead);return o.slice(0,3)}
  if(S.ch===8){fun8Opts(S,o,done,lead);return o.slice(0,3)}
  if(S.ch===4){fun4Opts(S,o,done,lead);return o.slice(0,3)}
  if(S.ch===3)fun3Opts(S,o,done,lead);
  else if(S.ch===5){o.push(opt(X('ฝังไว้ใกล้บ้าน แล้ววันหนึ่งนำกะโหลกขึ้นมาเก็บไว้กับครอบครัว','Bury them near the house, and one day bring the skull home to the family'),done(X('หลายปีต่อมา กะโหลกของผู้ตายถูกวางไว้ในบ้าน ให้ลูกหลานได้อยู่ใกล้','Years later the skull rests in the house, close to the descendants.'),{b:6,so:2})));
    o.push(opt(X('ทำพิธีส่งวิญญาณข้ามทะเลกลับบ้านเก่าของบรรพบุรุษ','Hold a rite sending the spirit across the sea to the ancestors’ homeland'),done(X('ทุกคนยืนบนหาดตอนตะวันตก มองทางที่วิญญาณจะเดินทางกลับไป','Everyone stands on the beach at sunset, looking the way the spirit will travel home.'),{b:5,kn:2+lead})))}
  else if(['ere','flo','luz','den'].includes(id)){o.push(opt(X('ทุกคนนั่งอยู่กับร่างจนเช้า','Everyone sits with the body until morning'),done(X('ไม่มีใครพูดอะไร แต่ไม่มีใครลุกไปไหนเลย','No one speaks, but no one leaves either.'),{b:5})));

{id:'h_feast',a:[24,72],w:1.8,rep:8,ch:3,cond:S=>herdVal()>=10,t:X('งานเลี้ยงใหญ่','The great feast'),

  opt(X('จัดงานเล็กๆ สำหรับครอบครัว','A small feast for the family'),S=>{addHerd(big,-1);fx({b:4,f:4});return X('อบอุ่นและเรียบง่าย','Warm and simple.')}),
  opt(X('เก็บสัตว์ไว้ให้ฝูงโตต่อ','Keep the animals so the herd grows'),S=>{fx({p:-3});S.stingy=(S.stingy||0)+1;return X('ฝูงของคุณใหญ่ขึ้น แต่แขกบางคนกลับบ้านพร้อมความผิดหวัง','Your herd grows, but some guests go home disappointed.')})]}},
{id:'h_theft',a:[16,72],w:1.6,rep:8,ch:3,cond:S=>herdTot()>=3,t:X('สัตว์หาย','Missing animals'),

  if(r)o.push(opt(PX(r,'กล่าวหา{p}','Accuse {p}'),S=>{const k=Object.keys(S.herd).find(k=>S.herd[k]>0);if(rnd()<.45){fx({p:4});r.tr-=10;return PX(r,'คุณเจอสัตว์อยู่ในคอกของ{p}จริงๆ ทุกคนเห็น','You find the animals in {p}’s pen. Everyone sees.')}if(k)addHerd(k,-2);fx({p:-6});r.tr-=25;return PX(r,'สัตว์ไม่ได้อยู่ที่{p} คนในหมู่บ้านเริ่มมองว่าคุณกล่าวหาคนง่ายเกินไป','The animals are not with {p}. The village starts to think you accuse too easily.')}));

{id:'h_inherit',deck:'adult',w:2,ch:3,cond:S=>herdTot()>=2,t:X('มรดก','The inheritance'),

  return[opt(PX(s,'แบ่งเท่าๆ กันกับ{p}','Split it evenly with {p}'),S=>{addHerd(k,Math.floor(n/2));s.tr+=15;return PX(s,'{p}กอดคุณ ทั้งสองคนร้องไห้ถึงพ่อแม่ด้วยกัน','{p} hugs you; you both weep for your parents together.')}),
   opt(X('เอาส่วนใหญ่ เพราะคุณดูแลพ่อแม่มากกว่า','Take most, since you cared for them more'),S=>{addHerd(k,Math.ceil(n*.75));s.tr-=30;if(s.tr<25)s.k='rival';return PX(s,'{p}ไม่พูดกับคุณอีกหลายปี','{p} does not speak to you for years.')}),
   opt(PX(s,'ยกให้{p}ทั้งหมด','Give it all to {p}'),S=>{s.tr+=30;fx({b:4,p:2});return X('ทุกคนแปลกใจ แต่ไม่มีใครลืม','Everyone is surprised, and no one forgets.')})]}},
{id:'h_cat',a:[10,70],w:2,ch:3,rg:['lev','ana'],cond:S=>S.ya<=10500&&!S.cat&&(S.field||S.inv.grain),t:X('แมวป่าในยุ้งข้าว','A wildcat in the grain store'),

    opt(X('ไล่มันไป','Chase it off'),S=>X('มันหายไปในความมืด และหนูก็กลับมา','It vanishes into the dark, and the mice return.'))]},
{id:'h_dog',a:[8,60],w:.35,ch:3,rg:['lev','ana','zag','yel','yan','gsa'],cond:S=>!S.dog,t:X('ลูกหมาในหมู่บ้าน','Puppies in the village'),

{id:'h_milk',a:[14,70],w:2.4,ch:3,cond:S=>S.ya<=9000&&MILKERS.some(k=>S.herd[k]>0)&&!S.milk,t:X('นม','Milk'),

    opt(X('ทิ้งไว้ให้เปรี้ยวในภาชนะ แล้วค่อยกิน','Leave it to sour, then eat it'),S=>{S.milk=2;fx({f:6,cr:2,kn:2});ms(X('ทำนมเปรี้ยวเป็นครั้งแรก','Made soured milk for the first time'));return X('รสเปรี้ยวแปลกๆ แต่ไม่ปวดท้อง และเก็บไว้ได้หลายวัน','Strangely sour, but it sits well and keeps for days.')}),
    opt(X('ให้ลูกแพะกินต่อ','Leave it for the kids'),S=>{S.milk=1;return X('คุณปล่อยให้แม่แพะเลี้ยงลูก','You let the nanny feed her young.')})]},
{id:'h_sick',a:[14,72],w:1.4,rep:7,ch:3,cond:S=>herdTot()>=3,t:X('สัตว์ป่วย','Sick animals'),

    opt(X('ล้มตัวที่ป่วยมากินก่อนจะตาย','Butcher the sick ones before they die'),S=>{fx({f:8});const k=Object.keys(S.herd).find(k=>S.herd[k]>0);if(k)addHerd(k,-2);if(rnd()<.4&&!S.sick){S.sick={k:'zoo',y:0};fx({h:-10});return X('ไม่กี่วันต่อมาคุณเริ่มมีไข้','A few days later you come down with a fever.')}return X('เนื้อไม่เสียเปล่า','The meat is not wasted.')}),

{id:'b_share',a:[22,70],w:1.6,ch:3,cond:S=>S.settled&&!S.cust.some(c=>['share','own','store'].includes(c)),t:X('ยุ้งเต็ม ยุ้งว่าง','Full stores, empty stores'),
 x:X('ปีนี้บางบ้านมีข้าวและสัตว์เหลือเฟือ บางบ้านแทบไม่มีอะไรกิน ผู้อาวุโสเรียกทุกคนมาตกลงกันว่าจะทำอย่างไร','This year some houses have grain and animals to spare, and some have almost nothing. The elders call everyone to agree what to do.'),n:INEQ,

    opt(X('เสนอให้แต่ละบ้านเก็บของของตัวเอง','Propose that each house keep its own'),S=>{if(addCust('own'))return X('ครอบครัวที่ขยันได้มากขึ้น ครอบครัวที่โชคร้ายก็ลำบากมากขึ้น','Hard-working families gain; unlucky ones struggle more.');return X('ไม่มีใครตกลงอะไรกันได้','No one can agree on anything.')}),
    opt(X('เสนอให้มียุ้งกลางที่ผู้อาวุโสดูแล','Propose a common store kept by the elders'),S=>{if(addCust('store')){if(S.rank>=2)fx({p:6});return X('ยุ้งกลางช่วยทุกคนในปีแล้ง และทำให้คนที่ถือกุญแจมีอำนาจมากขึ้นทุกปี','The common store saves everyone in dry years, and gives whoever holds it more power each year.')}return X('ทุกคนกลัวว่าคนดูแลยุ้งจะโกง','Everyone fears the store-keepers will cheat.')})]},
{id:'f_gobekli',a:[15,60],w:3,ch:3,rg:['ana'],cond:S=>S.ya<=11600&&S.ya>=10000,t:X('เสาหินบนเนินเขา','The stone pillars on the hill'),
 x:X('คนจากหลายกลุ่มมารวมกันบนเนินเขา เพื่อสกัดเสาหินปูนขนาดใหญ่และแกะสลักรูปสัตว์ลงบนนั้น','People from many groups gather on a hilltop to cut huge limestone pillars and carve animals on them.'),
 n:X('เกอเบคลีเตเปสร้างเมื่อราว 11,600 ปีก่อน โดยคนที่ยังล่าสัตว์และเก็บของป่า เสาบางต้นสูงกว่า 5 เมตร แกะสลักรูปสุนัขจิ้งจอก หมูป่า งู และนกแร้ง การค้นพบนี้ทำให้นักโบราณคดีบางคนตั้งคำถามว่าพิธีกรรมร่วมกันอาจมาก่อนเกษตรกรรม ไม่ใช่ตามหลัง','Göbekli Tepe was raised about 11,600 years ago by people who still hunted and gathered. Some pillars stand over 5 metres, carved with foxes, boars, snakes and vultures. It led some archaeologists to ask whether shared ritual came before farming rather than after.'),

function fun3Note(S){const r=S.rg;
  if(r==='lev')return X('ที่เจริโคและเทลอัสวัด ราว 10,000–9,000 ปีก่อน ผู้คนฝังศพใต้พื้นบ้าน แล้วนำกะโหลกขึ้นมาฉาบปูนปั้นเป็นใบหน้า ฝังตาด้วยเปลือกหอย ส่วนที่ไอน์ มัลลาฮา หญิงคนหนึ่งถูกฝังพร้อมลูกหมา','At Jericho and Tell Aswad, about 10,000–9,000 years ago, people buried the dead under house floors, then lifted the skulls and modelled faces on them in plaster, with shells for eyes. At Ain Mallaha a woman was buried with a puppy.');
  if(r==='ana'||r==='zag')return X('ที่ชาตัลฮือยุก ผู้คนฝังศพไว้ใต้แท่นนอนในบ้าน คนเป็นจึงนอนอยู่เหนือบรรพบุรุษทุกคืน บางร่างถูกโรยดินแดง','At Çatalhöyük the dead were buried beneath the sleeping platforms inside houses, so the living slept above their ancestors every night. Some were dusted with red ochre.');
  if(r==='yel'||r==='yan')return X('หลุมศพที่เจี๋ยหู ประเทศจีน ราว 9,000 ปีก่อน บางหลุมมีขลุ่ยกระดูกนกกระเรียนและกระดองเต่าที่ใส่ก้อนกรวดไว้ข้างใน','Graves at Jiahu, China, about 9,000 years ago, sometimes held crane-bone flutes and turtle shells filled with pebbles.');
  if(r==='gsa')return X('ที่โกเบโร ประเทศไนเจอร์ ผู้คนฝังศพไว้ริมทะเลสาบโบราณที่วันนี้เป็นทะเลทราย บางร่างฝังพร้อมเครื่องประดับ','At Gobero in Niger, people buried their dead beside an ancient lake that is desert today, some with ornaments.');
  if(r==='tha')return X('ในแหล่งวัฒนธรรมโฮบินเนียนหลายแห่ง ศพมักถูกฝังในท่างอตัว บางครั้งโรยดินแดงหรือวางเครื่องมือหินไว้ด้วย','At many Hoabinhian sites the dead were buried curled up, sometimes with red ochre or stone tools.');
  return X('ยังไม่มีหลักฐานชัดเจนว่าผู้คนในที่ราบสูงนิวกินีช่วงนี้ทำอะไรกับผู้ตาย ภาพในเกมเป็นการจำลอง','There is no clear evidence of how New Guinea highlanders of this time treated their dead; this is a simulation.')}
