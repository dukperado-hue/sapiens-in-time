    opt(X('ขับไล่คนที่ท้าทายออกจากกลุ่ม','Drive the challenger out of the band'),S=>{S.doubt=0;fx({p:3,b:-8});return X('เขาเดินจากไปพร้อมครอบครัว ที่เหลือเงียบ แต่ความเงียบนั้นไม่ใช่ความเชื่อ','He leaves with his family. The rest go quiet, but that quiet is not belief.')})]},
{id:'prophet',a:[28,75],w:1.6,sp:['sap'],cond:S=>S.spirit===1&&S.p>=75&&S.so>=45&&S.kn>=45,t:X('คนจากหลายกลุ่มเดินมาฟัง','People come from many bands to listen'),
 x:X('ข่าวเรื่องนิมิตของคุณเดินทางไปไกล คนจากกลุ่มที่คุณไม่เคยพบเดินมาหลายวันเพื่อฟังคุณเล่า','Word of your visions has travelled far. People from bands you have never met walk for days to hear you.'),
 n:X('เรื่องเล่าและพิธีกรรมที่ใช้ร่วมกันช่วยให้คนแปลกหน้าจำนวนมากร่วมมือกันได้ นักวิชาการหลายคนมองว่านี่คือรากของศาสนาในยุคต่อมา','Shared stories and rites let large numbers of strangers cooperate; many scholars see this as a root of later religions.'),
 of:S=>{const o=[opt(X('เล่าเรื่องของบรรพบุรุษ โดยใส่นิมิตของคุณลงไป','Tell the ancestors’ story with your vision woven in'),S=>{S.spirit=2;fx({p:10,so:3});ms(X('กลายเป็นผู้เห็นนิมิตที่หลายกลุ่มมาฟัง','Became a visionary heeded by many bands'));return X('คนจากหลายกลุ่มนำเรื่องของคุณกลับไปเล่าต่อ หลายปีต่อมาคุณได้ยินมันจากปากคนแปลกหน้า','People from many bands carry your story home. Years later you hear it from strangers’ lips.')})];
   if(S.leg)o.push(opt(X('✦ ประกาศว่าบรรพบุรุษเลือกคุณให้เป็นผู้ส่งสาร','✦ Declare that the ancestors chose you as their messenger'),S=>{S.spirit=3;fx({p:15,so:3});ms(X('ได้รับการเรียกขานว่าศาสดา ✦','Hailed as a prophet ✦'));return X('ในคืนนั้นดาวตกพุ่งข้ามฟ้า ทุกคนที่อยู่ตรงนั้นเชื่อว่ามันคือคำยืนยัน','That night a shooting star crosses the sky. Everyone there believes it is the sign.')}));
   o.push(opt(X('ส่งพวกเขากลับไปเล่ากันเอง','Send them home to tell it themselves'),S=>{fx({b:4});return X('คุณไม่อยากให้ใครเดินทางไกลเพื่อคุณ เรื่องเล่าควรเป็นของทุกคน','You do not want anyone walking far for you. Stories should belong to everyone.')}));return o}},
// ---------- FUNERALS ----------
{id:'funeral',a:[8,80],w:1.4,rep:7,t:X('พิธีศพ','A funeral'),
 xf:S=>pick([X('ผู้อาวุโสที่ทุกคนรักจากไปในคืนที่ฝนตก ทั้งกลุ่มต้องตัดสินใจว่าจะส่งเขาอย่างไร','A beloved elder dies on a rainy night. The band must decide how to send them on.'),X('นักล่าคนหนึ่งไม่ตื่นขึ้นมาอีกหลังป่วยหนัก ทุกคนมายืนล้อมร่างของเขา','A hunter does not wake after a long sickness. Everyone gathers around the body.'),X('หญิงชราผู้สอนทุกคนให้รู้จักพืชจากไปอย่างสงบ','The old woman who taught everyone the plants dies peacefully.')]),
 nf:S=>funNote(S),
 of:S=>funOpts(S)},

{id:'c_storm',deck:'child',w:2,t:X('หลงทางกลางพายุ','Lost in the storm'),
 x:X('ฝนตกหนักจนมองไม่เห็นที่พัก คุณหลงจากผู้ใหญ่ ฟ้าร้องดังจนพื้นสั่น','The rain is so heavy you cannot see the camp. You have lost the adults, and the thunder shakes the ground.'),
 o:[opt(X('หลบใต้ก้อนหินใหญ่ รอให้พายุผ่าน','Shelter under a big rock and wait it out'),S=>{fx({sv:3,h:-3});return X('ตอนเช้าฝนหยุด คุณเดินตามควันไฟกลับไปได้ ผู้ใหญ่ชมว่าคุณใจเย็น','By morning the rain stops and you follow the smoke home. The adults praise your calm.')}),
    opt(X('เดินต่อไปทางที่คิดว่าใช่','Keep walking the way you think is right'),S=>{if(rnd()<.5){fx({tr:3,b:2});return X('คุณเดาถูก และกลับถึงที่พักก่อนมืด','You guess right and reach camp before dark.')}fx({h:-10});return X('คุณเดินผิดทางทั้งคืน ผู้ใหญ่ตามหาเจอตอนรุ่งสาง ตัวสั่นและเปียกโชก','You walk the wrong way all night. The adults find you at dawn, shivering and soaked.')}),
    opt(X('ตะโกนเรียกไม่หยุด','Keep shouting'),S=>{fx({so:2,b:4,h:-2});return X('เสียงของคุณดังพอให้แม่ได้ยิน เธอกอดคุณแน่นจนหายใจไม่ออก','Your voice carries far enough for your mother to hear. She hugs you so hard you can barely breathe.')})]},
{id:'c_tool',deck:'child',w:2,xch:[3,5],t:X('เครื่องมือชิ้นแรก','Your first tool'),
 x:X('คุณตีหินอยู่ทั้งวันจนได้สะเก็ดคมชิ้นแรกที่ใช้ตัดหนังได้จริง','You knap all day until you strike your first flake sharp enough to really cut hide.'),
 o:[opt(X('เก็บไว้ใช้เอง','Keep it'),S=>{fx({cr:4});gift('blade');return X('คุณพกมันติดตัวทุกที่ และลับมันทุกเย็น','You carry it everywhere and sharpen it every evening.')}),
    opt(X('มอบให้แม่','Give it to your mother'),S=>{fx({b:6,so:2});return X('แม่ใช้มันแล่เนื้อในคืนนั้น และเล่าให้ทุกคนฟังว่าใครทำ','She uses it to cut meat that night and tells everyone who made it.')}),
    opt(X('ตีต่อจนนิ้วเลือดออก','Keep knapping until your fingers bleed'),S=>{fx({cr:7,h:-3});return X('มือคุณเจ็บไปหลายวัน แต่ชิ้นที่สองคมกว่าชิ้นแรกมาก','Your hands hurt for days, but the second flake is far sharper than the first.')})]},
{id:'c_sib',deck:'child',w:2,t:X('น้องป่วย','Your little sibling is sick'),
 x:X('น้องคนเล็กตัวร้อนจัดและไม่ยอมกินอะไรมาสองวัน ผู้ใหญ่ออกไปหาอาหารกันหมด','Your youngest sibling has burned with fever for two days and will not eat. The adults are all out foraging.'),
 o:[opt(X('นั่งเฝ้า ป้อนน้ำทีละน้อยทั้งคืน','Sit up all night giving sips of water'),S=>{fx({so:3,h:-2});if(rnd()<.75){fx({b:6});return X('ตอนเช้าไข้ลด น้องลืมตามาและยิ้มให้คุณ','By morning the fever breaks. Your sibling opens their eyes and smiles at you.')}fx({b:-3});return X('น้องอ่อนแรงลงเรื่อยๆ ผู้ใหญ่กลับมาทัน และบอกว่าคุณทำดีที่สุดแล้ว','Your sibling grows weaker. The adults come back in time and tell you that you did all you could.')}),
    opt(X('ไปเก็บใบไม้ที่ผู้เฒ่าใช้ลดไข้','Fetch the leaves the elders use for fever'),S=>{fx({kn:4});if(rnd()<.7){fx({b:4});return X('คุณจำใบไม้ถูกต้น ผู้เฒ่าพยักหน้าและต้มให้น้องดื่ม','You pick the right plant. The elder nods and boils it for your sibling.')}fx({h:-4});return X('คุณเก็บผิดต้น ผู้เฒ่าทิ้งมันไปและสอนให้จำใบที่ถูก','You picked the wrong one. The elder throws it away and shows you the right leaf.')})]},
{id:'c_ochre',deck:'child',w:1.5,cond:S=>!S.R.pac,t:X('ดินสีแดงในหน้าผา','Red earth in the cliff'),
 x:X('คุณเจอชั้นดินสีแดงเข้มในรอยแยกของหน้าผา ถูแล้วติดมือเป็นสีเลือด','You find a seam of deep red earth in a crack in the cliff. It rubs off on your hands like blood.'),
 o:[opt(X('ขนกลับไปให้กลุ่ม','Carry it back to the band'),S=>{fx({b:4,p:2});gift('ochre');return X('ผู้ใหญ่ตื่นเต้นกันมาก ดินแดงแบบนี้แลกของได้ดี','The adults are thrilled. Ochre like this trades well.')}),
    opt(X('ทาตัวเล่นกับเพื่อน','Paint yourselves with your friends'),S=>{fx({so:3,b:2});return X('เด็กทั้งกลุ่มกลายเป็นสีแดงทั้งตัว ผู้ใหญ่หัวเราะจนน้ำตาไหล','The whole pack of children turns red. The adults laugh until they cry.')}),
    opt(X('เก็บที่นั่นเป็นความลับ','Keep the place a secret'),S=>{fx({kn:2});gift('ochre');gift('ochre');return X('คุณจำทางไว้ และกลับมาเก็บทีละนิดเพื่อแลกของในวันข้างหน้า','You remember the way and come back for a little at a time, to trade one day.')})]},
{id:'c_swim',deck:'child',w:1.5,cond:hasWater,t:X('หัดว่ายน้ำ','Learning to swim'),
 x:X('พี่ๆ กระโดดลงน้ำลึกกันเสียงดัง คุณยืนอยู่ริมฝั่ง','The older children leap into deep water, shrieking. You stand at the edge.'),
 o:[opt(X('กระโดดตามลงไป','Jump in after them'),S=>{if(rnd()<.25){fx({h:-8});return X('คุณสำลักน้ำจนพี่ต้องลากขึ้นฝั่ง แต่วันต่อมาคุณก็กลับมาลองใหม่','You swallow water and an older child hauls you out, but the next day you try again.')}fx({sv:4,tr:2});return X('คุณตะเกียกตะกายจนลอยตัวได้ เย็นนั้นคุณว่ายข้ามแอ่งน้ำได้เป็นครั้งแรก','You thrash until you float. That evening you swim across the pool for the first time.')}),
    opt(X('หัดตรงน้ำตื้นกับพี่','Learn in the shallows with an older sibling'),S=>{fx({sv:2,b:3});return X('ช้าแต่ปลอดภัย พี่จับคางคุณไว้ไม่ให้จม','Slow but safe. Your sibling holds your chin above the water.')})]},
{id:'c_animal',deck:'child',w:1.6,t:X('สัตว์ผ่านมา','Something comes by'),
 xf:S=>X('คุณกำลังเล่นอยู่คนเดียว เมื่อเห็น'+animalText(S).th+'อยู่ห่างไปไม่กี่ก้าว','You are playing alone when you see '+animalText(S).en+' a few steps away.'),
 o:[opt(X('ยืนนิ่ง ไม่ขยับแม้แต่นิ้วเดียว','Freeze and do not move a finger'),S=>{if(rnd()<(hasT('eye')||hasT('calm')?.9:.7)){fx({sv:3,kn:2});return X('มันมองคุณนานจนใจจะขาด แล้วก็เดินจากไป','It stares at you for an age, then moves on.')}fx({h:-12});return X('มันพุ่งเข้าหา คุณได้แผลกลับมา แต่ผู้ใหญ่ไล่มันไปได้ทัน','It lunges. You come away hurt, but the adults drive it off in time.')}),
    opt(X('วิ่งไปหาผู้ใหญ่ให้เร็วที่สุด','Run to the adults as fast as you can'),S=>{if(rnd()<.55){fx({sv:2,b:2});return X('คุณวิ่งเร็วกว่าที่เคยวิ่งมาทั้งชีวิต และไปถึงก่อน','You run faster than ever in your life and get there first.')}fx({h:-12});return X('มันไล่ตามมาไม่กี่ก้าว คุณล้มลงและได้แผล แต่มันหยุดเมื่อผู้ใหญ่ตะโกน','It chases a few steps. You fall and get hurt, but it stops when the adults shout.')}),
    opt(X('ตะโกนและปาหินใส่','Shout and throw stones'),S=>{if(rnd()<(hasT('strong')?.75:.55)){fx({p:4,sv:2});return X('มันสะดุ้งและถอยหนีไป เด็กคนอื่นมองคุณด้วยสายตาใหม่','It flinches and backs away. The other children look at you differently now.')}fx({h:-15});return X('มันโกรธและพุ่งเข้าหา คุณได้แผลลึก','It gets angry and charges. You are badly hurt.')})]},
{id:'c_raid',deck:'child',w:.35,t:X('คนแปลกหน้าบุกตอนกลางคืน','Strangers in the night'),
 x:X('กลางดึก คนจากกลุ่มอื่นบุกเข้ามาแย่งอาหารและหนังสัตว์ ทุกคนตื่นขึ้นมาตะโกน','In the dead of night, people from another band burst in to take food and hides. Everyone wakes shouting.'),
 n:X('หลักฐานความรุนแรงระหว่างกลุ่มมีอยู่จริงในยุคหิน เช่น สุสานเจเบลซาฮาบา ซูดาน อายุราว 13,000 ปี','Evidence of violence between groups is real in the Stone Age, such as the Jebel Sahaba cemetery in Sudan, about 13,000 years old.'),
 o:[opt(X('พาเด็กเล็กซ่อนในพุ่มไม้','Hide the little ones in the bushes'),S=>{fx({so:3,b:5,f:-6});return X('คุณกอดเด็กเล็กไว้ไม่ให้ร้องจนเสียงเงียบไป ไม่มีใครในพุ่มไม้ได้รับบาดเจ็บ','You hold the little ones quiet until the noise fades. No one in the bushes is hurt.')}),
    opt(X('วิ่งไปปลุกผู้ใหญ่ที่หลับอยู่ไกล','Run to wake the adults sleeping farther off'),S=>{fx({p:3,b:4,f:-6});if(rnd()<.3){fx({h:-10});return X('คุณถูกผลักล้มกลางทาง แต่ผู้ใหญ่ตื่นทันและไล่พวกนั้นไปได้','You are knocked down on the way, but the adults wake in time and drive them off.')}return X('ผู้ใหญ่ตื่นทัน พวกที่บุกหนีไปพร้อมอาหารแค่ส่วนน้อย','The adults wake in time. The raiders flee with only a little food.')})]},
{id:'c_wind',deck:'child',w:1.4,t:X('ลมหอบ','The great wind'),
 x:X('ลมแรงพัดมาไม่หยุด หนังสัตว์ที่คลุมที่พักเริ่มปลิว','A wind that will not stop. The hides covering the shelter begin to fly.'),
 o:[opt(X('ช่วยผู้ใหญ่ดึงหนังสัตว์ไว้','Help the adults hold the hides down'),S=>{fx({sv:2,b:4});return X('คุณเกาะหนังไว้จนแขนสั่น ที่พักไม่พังลงมา','You cling to the hide until your arms shake. The shelter holds.')}),
    opt(X('วิ่งไล่เก็บของที่ปลิวไป','Chase the things that blow away'),S=>{fx({tr:2});if(rnd()<.5){gift('hide');return X('คุณวิ่งไล่ไปไกลจนเก็บหนังผืนใหญ่กลับมาได้','You chase far enough to bring back a big hide.')}return X('ของปลิวไปไกลเกินจะตาม แต่คุณได้รู้ว่าลมพัดไปทางไหนตลอดฤดูนี้','Things fly too far to follow, but you learn which way this season’s wind blows.')})]},
{id:'c_sun',deck:'child',w:1.3,cond:S=>!S.R.cold,t:X('แดดเผา','The burning sun'),
 x:X('แดดร้อนจัดหลายสัปดาห์ แหล่งน้ำใกล้ที่พักเหลือแค่โคลน','For weeks the sun blazes. The water hole near camp is down to mud.'),
 o:[opt(X('ตามผู้เฒ่าไปขุดหาน้ำในลำธารแห้ง','Follow an elder to dig for water in a dry stream'),S=>{fx({kn:4,f:2});return X('ผู้เฒ่าขุดลงไปใต้ทรายตรงโค้งลำธาร น้ำค่อยๆ ซึมขึ้นมา คุณจะจำวิธีนี้ไปทั้งชีวิต','The elder digs into the sand at the stream’s bend and water slowly seeps up. You will remember this all your life.')}),
    opt(X('นอนหลบแดดในเงาหินทั้งวัน','Lie in the rock’s shade all day'),S=>{fx({h:2});return X('คุณดูเงาหินค่อยๆ ขยับจนรู้ว่าตอนไหนแดดจะอ่อนลง','You watch the shadow creep and learn when the heat will ease.')})]},
{id:'c_cloud',deck:'child',w:1.3,t:X('เมฆก้อนสูง','The tall clouds'),
 x:X('ผู้เฒ่าชี้ให้ดูเมฆก้อนสูงที่ก่อตัวขึ้นทุกบ่าย และถามว่าคุณคิดว่ามันบอกอะไร','An elder points to the tall clouds that build every afternoon and asks what you think they are saying.'),
 o:[opt(X('ตั้งใจจำรูปร่างเมฆ','Study the shapes carefully'),S=>{fx({kn:4});return X('คุณเริ่มทายได้ว่าเมื่อไรฝนจะมา ผู้ใหญ่เริ่มมาถามคุณ','You start to guess when rain will come. The adults begin to ask you.')}),
    opt(X('บอกว่าเมฆหน้าเหมือนนก แล้ววิ่งเล่นต่อ','Say it looks like a bird and run off to play'),S=>{fx({sv:2,so:1});return X('ผู้เฒ่าหัวเราะ บ่ายนั้นฝนตกใส่คุณกลางทุ่ง','The elder laughs. That afternoon the rain catches you out on the plain.')})]},
{id:'c_snow',deck:'child',w:1.6,cond:S=>S.R.cold,t:X('หิมะแรก','The first snow'),
 x:X('เช้านี้ทุกอย่างขาวโพลน หิมะแรกของปีตกลงมาทั้งคืน','This morning everything is white. The year’s first snow fell all night.'),
 o:[opt(X('ช่วยกองหิมะเป็นกำแพงกันลม','Help pile snow into a windbreak'),S=>{fx({cr:2,b:3,h:2});return X('ที่พักอุ่นขึ้นมาก ผู้ใหญ่บอกว่าปีนี้คุณช่วยงานได้แล้ว','The shelter is much warmer. The adults say you are useful this year.')}),
    opt(X('ตามรอยสัตว์บนหิมะ','Follow the animal tracks in the snow'),S=>{fx({sv:3,kn:2,f:3});return X('รอยบนหิมะบอกทุกอย่าง คุณพาผู้ใหญ่ไปเจอกระต่ายหลายตัว','Snow tells everything. You lead the adults to a string of hares.')})]},
{id:'c_lightning',deck:'child',w:1.3,t:X('ฟ้าผ่า','Lightning'),
 x:X('ฟ้าผ่าลงต้นไม้ใหญ่ใกล้ที่พัก เปลวไฟลุกขึ้นท่ามกลางสายฝน','Lightning strikes a big tree near camp. Flames rise in the rain.'),
 o:[opt(X('ช่วยผู้ใหญ่ขนถ่านไฟกลับมา','Help the adults carry embers back'),S=>{fx({p:3,b:3});if(rnd()<.2){fx({h:-6});return X('ถ่านร้อนลวกมือคุณ แต่ไฟกองใหม่ของกลุ่มลุกโชนจากถ่านที่คุณถือมา','A hot coal burns your hand, but the band’s new fire roars from the embers you carried.')}return X('คุณถือกิ่งไม้ที่ติดไฟกลับมาอย่างระวัง ทุกคนเรียกมันว่าไฟของคุณ','You carry a burning branch home with great care. Everyone calls it your fire.')}),
    opt(X('วิ่งหนีไปที่ริมน้ำ','Run to the water'),S=>X('คุณดูต้นไม้ไหม้จากริมน้ำจนฝนดับไฟ','From the water’s edge you watch the tree burn until the rain puts it out.'))]},
{id:'c_eclipse',deck:'child',w:.4,t:X('ดวงอาทิตย์ถูกกลืน','The sun is swallowed'),
 x:X('กลางวันแสกๆ ฟ้าค่อยๆ มืดลง ดวงอาทิตย์เหลือแค่วงแหวนเรืองแสง นกหยุดร้อง','At midday the sky slowly darkens. The sun becomes a glowing ring. The birds fall silent.'),
 n:X('สุริยุปราคาเต็มดวงผ่านจุดเดียวกันบนโลกโดยเฉลี่ยหลายร้อยปีครั้ง หลายคนอาจได้เห็นแค่ครั้งเดียวในชีวิต หรือไม่เคยเห็นเลย','A total solar eclipse passes over the same spot only once every few hundred years on average. Many people see one once in a lifetime, or never.'),
 o:[opt(X('ซ่อนหน้าในอกแม่','Hide your face against your mother'),S=>{fx({b:3});return X('เมื่อคุณเงยหน้าขึ้น แสงกลับมาแล้ว แม่ยังกอดคุณแน่น','When you look up the light is back. Your mother is still holding you tight.')}),
    opt(X('มองตามผู้เฒ่าที่ร้องเพลงเรียกแสง','Watch the elders sing the light back'),S=>{fx({kn:4,so:2});return X('ผู้เฒ่าร้องเพลงไม่หยุด และแสงก็กลับมาจริงๆ คุณจะเล่าเรื่องนี้ไปจนแก่','The elders sing without stopping, and the light truly returns. You will tell this story until you are old.')})]},
{id:'c_mem',deck:'child',w:3,cond:S=>hasT('mem'),t:X('จำทางกลับ','Remembering the way'),
 x:X('ผู้ใหญ่หลงทางกลางหมอก ทุกคนเถียงกันว่าทางไหน คุณจำได้ว่าเคยผ่านต้นไม้ล้มต้นหนึ่ง','The adults are lost in the fog, arguing over the way. You remember passing a fallen tree.'),
 o:[opt(X('พูดออกมา','Speak up'),S=>{fx({p:5,kn:3,b:3});return X('คุณพาทุกคนกลับถึงที่พัก ตั้งแต่นั้นผู้ใหญ่ฟังคุณมากขึ้น','You lead everyone home. From then on the adults listen to you more.')}),
    opt(X('เงียบไว้ เพราะเป็นแค่เด็ก','Stay quiet; you are only a child'),S=>{fx({h:-4});return X('กว่าทุกคนจะหาทางเจอก็มืดค่ำ คุณเสียใจที่ไม่ได้พูด','By the time they find the way it is dark. You wish you had spoken.')})]},
{id:'c_voice',deck:'child',w:3,cond:S=>hasT('voice'),t:X('เพลงกล่อมเด็ก','A lullaby'),
 x:X('เด็กอ่อนในกลุ่มร้องไห้ทั้งคืน ไม่มีใครทำให้หยุดได้','A baby in the band cries all night and nobody can settle it.'),
 o:[opt(X('ร้องเพลงที่แม่เคยร้องให้คุณฟัง','Sing the song your mother sang to you'),S=>{fx({so:4,b:6,p:2});return X('เด็กเงียบลงและหลับไป ผู้ใหญ่หลายคนนั่งฟังจนจบเพลง','The baby quiets and sleeps. Several adults sit listening until the song ends.')}),
    opt(X('แต่งเพลงใหม่ขึ้นมาเอง','Make up a new song'),S=>{fx({so:3,kn:2,b:4});return X('เพลงของคุณติดหูจนเด็กคนอื่นร้องตามไปหลายปี','Your song is so catchy the other children sing it for years.')})]},
{id:'c_hand',deck:'child',w:3,cond:S=>hasT('hand'),t:X('ของเล่นจากกระดูก','A bone toy'),
 x:X('คุณใช้เศษหินแกะกระดูกนกเป็นนกหวีดเล็กๆ','With a stone chip you carve a bird bone into a little whistle.'),
 o:[opt(X('ให้น้องเล่น','Give it to a younger child'),S=>{fx({cr:3,b:4});return X('เสียงนกหวีดดังทั่วที่พักไปทั้งฤดู ไม่มีใครบ่นสักคำ','The whistle shrills through camp all season. Nobody complains once.')}),
    opt(X('เอาไปแลกกับผู้ใหญ่','Trade it to an adult'),S=>{fx({cr:3});gift('bead');return X('ผู้ใหญ่คนหนึ่งให้ลูกปัดเปลือกหอยแลกกับมัน','An adult gives you a shell bead for it.')})]},
{id:'c_eye',deck:'child',w:3,cond:S=>hasT('eye'),t:X('งูในกองใบไม้','A snake in the leaves'),
 x:X('น้องกำลังเดินไปหยิบผลไม้ในกองใบไม้ คุณเห็นอะไรบางอย่างขยับอยู่ข้างใต้','Your sibling reaches for fruit in a pile of leaves. You see something move beneath.'),
 o:[opt(X('ดึงน้องกลับทันที','Yank your sibling back'),S=>{fx({p:4,b:5,kn:2});return X('งูพิษเลื้อยออกมาตรงที่มือน้องเพิ่งอยู่ ผู้ใหญ่เล่าเรื่องนี้กันทั้งคืน','A venomous snake slides out where the hand just was. The adults talk about it all night.')}),
    opt(X('ตะโกนเตือน','Shout a warning'),S=>{fx({b:3});return X('น้องสะดุ้งถอยทัน งูเลื้อยหนีไป','Your sibling jumps back in time and the snake slides away.')})]},
{id:'c_reef',deck:'child',w:2,ch:5,t:X('แนวปะการังตอนน้ำลง','The reef at low tide'),
 x:X('น้ำลงต่ำจนแนวปะการังโผล่ คุณเดินหาหอยกับเด็กคนอื่น','The tide is so low the reef shows. You hunt for shellfish with the other children.'),
 o:[opt(X('เดินออกไปจนสุดขอบแนวปะการัง','Go all the way to the reef’s edge'),S=>{if(rnd()<.3){fx({h:-8});return X('คุณเหยียบเม่นทะเล เท้าบวมไปหลายวัน','You step on a sea urchin. Your foot swells for days.')}fx({sv:3,f:4});gift('shell');return X('ที่ขอบแนวปะการังมีหอยใหญ่ที่ไม่มีใครเก็บ คุณได้เปลือกสวยกลับมาด้วย','At the edge are big shellfish no one has taken, and you bring home a beautiful shell.')}),
    opt(X('เก็บใกล้ฝั่งกับเด็กคนอื่น','Stay near shore with the others'),S=>{fx({sv:2,b:2,f:3});return X('ตะกร้าเต็มก่อนน้ำขึ้น ทุกคนกลับมาพร้อมกัน','The basket is full before the tide turns, and everyone comes back together.')})]},
{id:'c_mammoth',deck:'child',w:2,ch:2,cond:S=>S.R.mam,t:X('แมมมอธตัวแรก','Your first mammoth'),
 x:X('คุณเห็นแมมมอธใกล้ๆ เป็นครั้งแรก ตัวมันใหญ่กว่าที่พักทั้งหลัง','For the first time you see a mammoth up close. It is bigger than the whole shelter.'),
 o:[opt(X('ยืนดูจนมันเดินลับไป','Watch until it walks out of sight'),S=>{fx({kn:3});return X('คุณจำได้ทุกอย่าง ทั้งเสียงหายใจ กลิ่น และขนที่ปลิวตามลม','You remember everything: its breath, its smell, its hair blowing in the wind.')}),
    opt(X('วิ่งไปบอกนักล่า','Run to tell the hunters'),S=>{fx({p:2,b:2,tr:1});return X('นักล่าลูบหัวคุณ และพาคุณไปดูรอยเท้ามันในวันต่อมา','The hunters ruffle your hair and take you to see its tracks the next day.')})]},
// ---------- YOUTH ----------
{id:'y_journey',deck:'youth',w:2,t:X('เดินทางคนเดียว','Walking alone'),
 x:X('ผู้ใหญ่ให้คุณเดินทางคนเดียวสามวันไปส่งข่าวให้ญาติอีกกลุ่ม','The adults send you alone on a three-day walk to carry news to kin in another band.'),
 o:[opt(X('ไปทางลัดข้ามเขา','Take the shortcut over the hills'),S=>{fx({tr:5});if(rnd()<.3){fx({h:-10});return X('คุณหลงอยู่สองวันบนเขา ไปถึงช้ากว่าที่ควรและผอมลง','You are lost two days in the hills and arrive late and thinner.')}addFriend();return X('คุณไปถึงก่อนกำหนด ญาติอีกกลุ่มจำคุณได้ตลอดไป','You arrive early. Your kin over there never forget you.')}),
    opt(X('ไปตามทางที่ทุกคนใช้','Follow the path everyone uses'),S=>{fx({tr:3,so:2});addFriend();return X('ระหว่างทางคุณพบคนจากกลุ่มอื่นและเดินคุยกันไปตลอดทาง','On the way you meet someone from another band and talk the whole way.')})]},
{id:'y_dance',deck:'youth',w:2,t:X('งานเต้นรำรอบกองไฟ','The dance by the fire'),
 x:X('หลายกลุ่มมารวมกันในฤดูที่อาหารอุดม คืนนี้ทุกคนเต้นรำรอบกองไฟใหญ่','Many bands gather in the season of plenty. Tonight everyone dances around a great fire.'),
 n:X('การชุมนุมตามฤดูของหลายกลุ่มเป็นช่วงเวลาของการแลกของ หาคู่ และจัดพิธี พบในสังคมนักล่าหลายแห่ง','Seasonal gatherings of many bands are a time to trade, find partners and hold ceremonies, found in many hunter-gatherer societies.'),
 o:[opt(X('เต้นจนรุ่งสาง','Dance till dawn'),S=>{fx({so:4,b:4});S.crush=1;return X('มีคนหนึ่งเต้นอยู่ข้างคุณทั้งคืน คุณยังจำรอยยิ้มนั้นได้','Someone dances beside you all night. You still remember that smile.')}),
    opt(X('นั่งคุยกับคนแปลกหน้า','Sit and talk with strangers'),S=>{fx({so:3,kn:2});addFriend();return X('คุณได้เพื่อนใหม่จากกลุ่มที่อยู่ไกลออกไป','You make a friend from a band that lives far away.')})]},
{id:'y_master',deck:'youth',w:1.6,t:X('ครูจากกลุ่มอื่น','A teacher from another band'),
 x:X('ช่างฝีมือคนหนึ่งจากกลุ่มอื่นเห็นงานของคุณ และยอมสอนถ้าคุณไปอยู่กับเขาหนึ่งฤดู','A craftsperson from another band sees your work and offers to teach you if you live with them for a season.'),
 o:[opt(X('ไปอยู่กับเขาหนึ่งฤดู','Go for a season'),S=>{fx({cr:8,kn:2,b:-3});addFriend();return X('คุณกลับมาพร้อมวิธีทำที่ไม่มีใครในกลุ่มเคยเห็น','You come home with techniques no one in your band has seen.')}),
    opt(X('อยู่กับกลุ่มของตัวเอง','Stay with your own band'),S=>{fx({b:3});return X('คุณขอบคุณเขา และเรียนรู้จากผู้ใหญ่ในกลุ่มต่อไป','You thank them and keep learning from your own elders.')})]},
{id:'y_fire',deck:'youth',w:1.6,cond:S=>!S.R.pac,t:X('ไฟป่าลามเข้ามา','The fire comes'),
 x:X('ไฟป่าลามเข้าใกล้ที่พักเร็วกว่าที่ใครคิด เด็กคนหนึ่งยังอยู่ในเพิง','A wildfire reaches camp faster than anyone expected. A child is still in a shelter.'),
 o:[opt(X('วิ่งเข้าไปพาเด็กออกมา','Run in and bring the child out'),S=>{fx({p:8,b:6});if(rnd()<.3){fx({h:-14});return X('คุณพาเด็กออกมาได้ แต่ขาโดนไฟลวกเป็นแผลใหญ่ ทุกคนเรียกคุณว่าคนกล้า','You get the child out, but your leg is badly burned. Everyone calls you brave.')}ms(X('ช่วยเด็กออกจากไฟป่า','Saved a child from a wildfire'));return X('คุณอุ้มเด็กออกมาทันก่อนเพิงไหม้ แม่ของเด็กร้องไห้กอดคุณ','You carry the child out just before the shelter burns. The mother weeps and holds you.')}),
    opt(X('ตะโกนเรียกผู้ใหญ่','Shout for the adults'),S=>{fx({b:2});return X('ผู้ใหญ่วิ่งมาทันและพาเด็กออกไปได้','The adults arrive in time and get the child out.')})]},
{id:'y_tradetrip',deck:'youth',w:1.6,t:X('ตามผู้ใหญ่ไปแลกของ','A trading trip'),
 x:X('ผู้ใหญ่จะเดินทางหลายวันไปแลกของกับกลุ่มที่อยู่ไกล และชวนคุณไปด้วย','The adults will walk for days to trade with a distant band, and they invite you along.'),
 o:[opt(X('ไปด้วย','Go'),S=>{fx({tr:3,so:3});addFriend();gift(S.R.pac?'shell':pick(['shell','ochre']));return X('คุณได้เห็นที่ที่ไม่เคยเห็น และได้ของหายากติดมือกลับมา','You see places you have never seen and come back with something rare.')}),
    opt(X('อยู่ช่วยงานที่บ้าน','Stay and help at home'),S=>{fx({b:3,sv:2});return X('งานที่บ้านเยอะกว่าที่คิด แต่ทุกคนรู้ว่าพึ่งคุณได้','There is more work at home than you thought, but everyone knows they can count on you.')})]},
{id:'y_starlore',deck:'youth',w:1.5,t:X('ชื่อของดวงดาว','The names of the stars'),
 x:X('คืนที่ฟ้าใส ผู้เฒ่าชี้ดาวทีละดวงและเล่าว่าแต่ละดวงคือใคร','On a clear night an elder points to the stars one by one and tells who each one is.'),
 o:[opt(X('ถามว่าดาวมาจากไหน','Ask where the stars come from'),S=>{fx({kn:4,so:1});return X('ผู้เฒ่าเล่าเรื่องจนดึก คุณจำได้ทุกคำ','The elder tells stories deep into the night. You remember every word.')}),
    opt(X('จำว่าดาวไหนขึ้นตอนฤดูไหน','Learn which stars rise in which season'),S=>{fx({kn:3,tr:3});return X('ตั้งแต่นั้นคุณรู้ว่าเมื่อไรฝูงสัตว์จะย้ายแค่จากการดูฟ้า','From then on you know when the herds will move just from the sky.')})]},
{id:'y_stampede',deck:'youth',w:1.4,cond:S=>!S.R.pac,t:X('ฝูงสัตว์แตกตื่น','Stampede'),
 x:X('ฝูงสัตว์ตกใจอะไรบางอย่าง และวิ่งตรงมาทางที่คุณยืนอยู่','Something spooks the herd, and it thunders straight toward you.'),
 o:[opt(X('กระโดดหลบหลังก้อนหิน','Dive behind a boulder'),S=>{fx({sv:3});return X('ฝุ่นตลบไปหมด ฝูงสัตว์ผ่านไปข้างตัวคุณราวกับแม่น้ำ','Dust everywhere. The herd pours past you like a river.')}),
    opt(X('แทงตัวที่ล้มลงกลางฝูง','Spear one that falls in the crush'),S=>{if(rnd()<.7){fx({f:12,p:5,sv:2});return X('คุณได้สัตว์ทั้งตัวโดยไม่ต้องออกล่า ทุกคนกินอิ่มหลายวัน','You take a whole animal without a hunt. Everyone eats well for days.')}fx({h:-15});S.inj=1;return X('คุณถูกเหยียบล้ม ซี่โครงร้าว','You are trampled and crack a rib.')})]},
{id:'y_raid',deck:'youth',w:.3,t:X('ปกป้องที่พัก','Defending the camp'),
 x:X('คนกลุ่มหนึ่งมาพร้อมหอก เรียกร้องให้แบ่งแหล่งน้ำของกลุ่มคุณ','A group arrives with spears, demanding a share of your band’s water.'),
 o:[opt(X('ยืนแนวหน้ากับผู้ใหญ่','Stand at the front with the adults'),S=>{fx({p:6});if(rnd()<.35){fx({h:-15});S.inj=1;return X('มีการปะทะกันสั้นๆ คุณได้แผล แต่พวกนั้นถอยกลับไป','A short clash. You are wounded, but they withdraw.')}return X('เมื่อเห็นว่ากลุ่มคุณไม่ถอย พวกนั้นก็หันหลังกลับ','Seeing your band will not back down, they turn away.')}),
    opt(X('พาเด็กและคนแก่ไปที่ปลอดภัย','Take the children and elders to safety'),S=>{fx({b:6,so:3});return X('ทุกคนที่คุณพาไปปลอดภัย ผู้ใหญ่เจรจาจนแบ่งน้ำกันได้','Everyone you lead away is safe. The adults talk until the water is shared.')})]},
{id:'y_rite',deck:'youth',w:1.6,t:X('พิธีเข้าสู่วัยผู้ใหญ่','Coming of age'),
 x:X('ถึงเวลาที่คุณต้องผ่านพิธีเข้าสู่วัยผู้ใหญ่ต่อหน้าทุกคน','It is time to pass your coming-of-age rite before everyone.'),
 o:[opt(X('ทาสีร่างกาย อดอาหารสามวันในป่า','Paint your body and fast three days in the wild'),S=>{fx({p:5,sv:2,h:-4});return X('คุณกลับมาผอมลงแต่ยืนตรง ผู้ใหญ่ทักทายคุณแบบคนเท่ากัน','You return thinner but standing tall. The adults greet you as an equal.')}),
    opt(X('ร้องเพลงที่แต่งเองต่อหน้าทุกคน','Sing a song you made, before everyone'),S=>{fx({so:4,p:hasT('voice')?6:3});return X('ทั้งกลุ่มร้องตามท่อนสุดท้าย เพลงของคุณกลายเป็นของทุกคน','The whole band joins the last verse. Your song now belongs to everyone.')})]},
{id:'y_curious',deck:'youth',w:3,cond:S=>hasT('curious'),t:X('ผลไม้ที่ไม่มีใครกิน','The fruit no one eats'),
 x:X('มีผลไม้สีม่วงที่ไม่มีใครในกลุ่มกล้ากิน คุณอยากรู้มากว่ารสชาติเป็นอย่างไร','There is a purple fruit no one in the band dares eat. You badly want to know what it tastes like.'),
 o:[opt(X('ลองกินนิดเดียว','Take a tiny bite'),S=>{if(rnd()<.5){fx({kn:6,p:3});return X('มันหวานและไม่เป็นพิษ ตั้งแต่นั้นทั้งกลุ่มมีอาหารเพิ่มอีกอย่าง','It is sweet and harmless. The band has one more food from then on.')}fx({h:-12,kn:3});return X('คุณอาเจียนทั้งคืน แต่ทุกคนรู้แล้วว่าต้องห้ามกิน','You vomit all night, but now everyone knows not to eat it.')}),
    opt(X('ให้สัตว์ลองกินก่อน','Let an animal try it first'),S=>{fx({kn:4});return X('คุณเฝ้าดูนกที่จิกกินมันอยู่หลายวัน มันไม่เป็นอะไร','You watch birds eat it for days. They are fine.')})]},
{id:'y_legs',deck:'youth',w:3,cond:S=>hasT('legs'),t:X('นักวิ่งส่งข่าว','The runner'),
 x:X('มีข่าวด่วนต้องส่งไปถึงกลุ่มข้างเคียงก่อนพลบค่ำ ทุกคนหันมามองคุณ','Urgent news must reach the next band before dusk. Everyone looks at you.'),
 o:[opt(X('วิ่งไปทันที','Run at once'),S=>{fx({tr:5,p:4});addFriend();return X('คุณวิ่งตลอดบ่ายและไปถึงก่อนตะวันตก ข่าวที่คุณนำไปช่วยให้พวกเขาหนีน้ำท่วมทัน','You run all afternoon and arrive before sunset. Your news lets them escape a flood in time.')}),
    opt(X('ชวนเพื่อนวิ่งไปด้วยกัน','Run together with a friend'),S=>{fx({tr:3,so:3,b:3});return X('สองคนผลัดกันนำ ไปถึงพร้อมกันและหัวเราะจนหายเหนื่อย','You take turns leading, arrive together and laugh until you get your breath back.')})]},
// ---------- ADULT ----------
{id:'a_epidemic',deck:'adult',w:1.4,t:X('ไข้ระบาดในกลุ่ม','Fever in the band'),
 x:X('คนในกลุ่มป่วยด้วยไข้เดียวกันทีละคน จนเหลือคนแข็งแรงไม่ถึงครึ่ง','One by one the band falls sick with the same fever, until fewer than half are well.'),
 o:[opt(X('แยกคนป่วยไว้อีกเพิงและดูแลเอง','Move the sick to another shelter and nurse them'),S=>{fx({so:4,b:6,p:3});if(rnd()<.4){S.sick={k:'fever',y:0};fx({h:-12});return X('คุณดูแลทุกคนจนหาย แต่ตัวเองก็ล้มป่วยตามมา','You nurse them all back, then fall sick yourself.')}return X('คนป่วยค่อยๆ หายทีละคน คุณไม่ป่วยเลยสักวัน','The sick recover one by one. You never fall ill.')}),
    opt(X('พาครอบครัวไปตั้งที่พักห่างๆ ชั่วคราว','Take your family to camp apart for a while'),S=>{fx({b:-5,h:2});return X('ครอบครัวคุณปลอดภัย แต่บางคนในกลุ่มไม่ลืมว่าคุณไปไหนตอนที่พวกเขาป่วย','Your family stays safe, but some in the band do not forget where you were when they were sick.')}),
    opt(X('ต้มสมุนไพรให้ทุกคน','Brew herbs for everyone'),S=>{if(S.kn>=35){fx({p:8,b:6,kn:2});return X('สมุนไพรของคุณช่วยได้จริง ไข้ลดเร็วกว่าที่ใครคาด','Your herbs really help. The fever falls faster than anyone expected.')}fx({kn:3,b:2});return X('คุณยังรู้จักสมุนไพรไม่พอ แต่ความตั้งใจของคุณทำให้ทุกคนอุ่นใจ','You do not know enough plants yet, but your care comforts everyone.')})]},
{id:'a_famine',deck:'adult',w:1.6,cond:S=>S.f<50,t:X('ปีอดอยาก','The hungry year'),
 x:X('อาหารเหลือน้อยจนเด็กๆ เริ่มร้องไห้ตอนกลางคืน','Food is so short the children have started crying at night.'),
 o:[opt(X('ขอความช่วยเหลือจากเพื่อนต่างกลุ่ม','Ask your friends in other bands for help'),S=>{if(S.fr.length){const f=pick(S.fr);fx({f:16});f.b-=10;return X('เพื่อนจาก'+f.n.th+'ส่งอาหารมาให้ทันที โดยไม่ถามอะไรสักคำ','Your friend from '+f.n.en+' sends food at once, without a single question.')}fx({so:2});return X('คุณไม่มีเพื่อนต่างกลุ่มที่จะขอได้ คุณตั้งใจว่าจะไม่ให้เป็นแบบนี้อีก','You have no friends in other bands to ask. You promise yourself it will not happen again.')}),
    opt(X('แบ่งส่วนของตัวเองให้เด็กก่อน','Give your share to the children first'),S=>{fx({b:8,h:-8,p:4});return X('คุณผอมลงจนเห็นซี่โครง แต่เด็กทุกคนในกลุ่มผ่านฤดูนี้ไปได้','You grow thin enough to count your ribs, but every child in the band gets through the season.')}),
    opt(X('ออกไปล่าไกลกว่าที่เคยไป','Hunt farther than ever before'),S=>{fx({sv:3,tr:2});if(rnd()<.5){fx({f:15,p:3});return X('ห่างออกไปสามวันมีฝูงสัตว์ที่ไม่มีใครล่า คุณกลับมาพร้อมเนื้อ','Three days out is a herd no one hunts. You come home with meat.')}fx({h:-10});return X('คุณกลับมามือเปล่าและเหนื่อยจนแทบเดินไม่ไหว','You come back empty-handed and barely able to walk.')})]},
{id:'a_fartrade',deck:'adult',w:1.6,xch:[3],t:X('หินจากแดนไกล','Stone from far away'),
 x:X('มีข่าวว่าไกลออกไปหลายสิบวันเดิน มีกลุ่มที่มีหินดีที่สุดสำหรับทำใบมีด','Word comes that dozens of days’ walk away, a band has the finest stone for blades.'),
 n:X('หินออบซิเดียนและหินคุณภาพดีถูกนำไปไกลหลายร้อยกิโลเมตรจากแหล่ง ทั้งด้วยการเดินทางและการแลกเปลี่ยนต่อกันเป็นทอดๆ','Obsidian and fine stone travelled hundreds of kilometres from their sources, by journeys and by trade passed hand to hand.'),
 o:[opt(X('เดินทางไปเอง','Make the journey yourself'),S=>{fx({tr:5,so:2});if(rnd()<.2){fx({h:-10});return X('ระหว่างทางคุณป่วยหนัก ต้องกลับก่อนจะไปถึง','You fall badly ill on the way and must turn back.')}addItem('blade',2);addFriend();ms(X('เดินทางไกลไปแลกหินดี','Travelled far to trade for fine stone'));return X('คุณกลับมาพร้อมหินที่คมที่สุดที่กลุ่มเคยเห็น และเพื่อนใหม่อีกคน','You come home with the sharpest stone the band has ever seen, and a new friend.')}),
    opt(X('ฝากของไปกับเพื่อนต่างกลุ่ม','Send goods with a friend from another band'),S=>{if(S.fr.length&&invCount()){const ks=Object.keys(S.inv).filter(k=>S.inv[k]>0);S.inv[pick(ks)]--;addItem('blade',2);fx({so:2});return X('หลายเดือนต่อมา หินดีก็มาถึงมือคุณผ่านคนหลายกลุ่ม','Months later the fine stone reaches you, passed through many hands.')}return X('คุณไม่มีทั้งของและเพื่อนที่จะฝาก','You have neither the goods nor a friend to send them with.')})]},
{id:'a_quarrel',deck:'adult',w:1.6,t:X('สองครอบครัวทะเลาะกัน','Two families quarrel'),
 x:X('สองครอบครัวในกลุ่มทะเลาะกันเรื่องแบ่งเนื้อ จนอีกฝ่ายขู่ว่าจะแยกกลุ่ม','Two families fight over sharing meat until one threatens to leave the band.'),
 o:[opt(X('เป็นคนกลางไกล่เกลี่ย','Step in to mediate'),S=>{if(rnd()<.55+S.so/200+(hasT('calm')?.15:0)){fx({p:6,so:3,b:4});return X('คุณให้ทั้งสองฝ่ายพูดจนหมดเรื่อง แล้วกินข้าวด้วยกัน คืนนั้นไม่มีใครแยกไป','You let both sides talk themselves out, then eat together. No one leaves that night.')}fx({b:-4});return X('ทั้งสองฝ่ายหันมาโกรธคุณแทน ครอบครัวหนึ่งแยกไปตั้งกลุ่มใหม่','Both sides turn their anger on you. One family leaves to start its own band.')}),
    opt(X('เข้าข้างครอบครัวของตัวเอง','Side with your own family'),S=>{fx({b:-5,p:1});return X('ครอบครัวคุณพอใจ แต่อีกฝ่ายจะจำเรื่องนี้ไปอีกนาน','Your family is pleased, but the other side will remember for a long time.')}),
    opt(X('ปล่อยให้เวลาจัดการ','Let time sort it out'),S=>{fx({b:-2});return X('ความโกรธค่อยๆ จางไปเองหลังหลายฤดู','The anger fades by itself after several seasons.')})]},
{id:'a_flood',deck:'adult',w:1.4,cond:hasWater,t:X('น้ำขึ้นเร็ว','The water rises fast'),
 x:X('ฝนตกต้นน้ำมาหลายวัน แม่น้ำขึ้นเร็วจนเห็นได้ทุกครั้งที่หันไปมอง','It has rained upstream for days. The river rises so fast you can see it every time you look.'),
 o:[opt(X('ขนอาหารขึ้นเนินก่อน','Carry the food uphill first'),S=>{fx({f:4,b:-2});return X('อาหารรอดทั้งหมด แต่ที่พักหลายหลังถูกพัดไป','All the food is saved, but several shelters wash away.')}),
    opt(X('พาคนแก่และเด็กขึ้นเนินก่อน','Get the elders and children uphill first'),S=>{fx({b:8,p:5,f:-8});return X('ทุกคนปลอดภัย อาหารที่เก็บไว้ลอยไปกับน้ำ แต่ไม่มีใครต่อว่าคุณสักคำ','Everyone is safe. The stored food floats away, but no one says a word against you.')})]},
{id:'a_newcomer',deck:'adult',w:1.5,t:X('คนแปลกหน้าขอเข้าร่วม','A stranger asks to join'),
 x:X('ชายคนหนึ่งเดินมาคนเดียว เขาบอกว่ากลุ่มของเขาแตกกระจายไปหมดแล้ว','A man walks in alone. He says his band has scattered.'),
 o:[opt(X('ต้อนรับเขาเข้ากลุ่ม','Welcome him in'),S=>{if(rnd()<.15){S.sick={k:'fever',y:0};fx({h:-10,b:2});return X('เขานำไข้แปลกมาด้วย คุณป่วยอยู่นาน แต่เขาก็กลายเป็นคนในกลุ่มจริงๆ','He brings a strange fever. You are sick a long time, but he truly becomes one of you.')}fx({b:3,kn:4});return X('เขารู้จักพืชและเส้นทางที่ไม่มีใครในกลุ่มรู้ และสอนทุกอย่างให้','He knows plants and routes none of you know, and he teaches all of it.')}),
    opt(X('ให้อาหารแล้วให้เขาเดินทางต่อ','Feed him and send him on'),S=>{fx({f:-3});return X('เขาขอบคุณ และหายไปในทุ่งตอนเช้า','He thanks you and disappears into the grassland at dawn.')})]},
{id:'a_teach',deck:'adult',w:1.6,t:X('ลูกศิษย์คนแรก','Your first apprentice'),
 x:X('เด็กคนหนึ่งตามคุณไปทุกที่ อยากเรียนสิ่งที่คุณทำได้ดี','A child follows you everywhere, wanting to learn what you do well.'),
 o:[opt(X('สอนทุกอย่างที่รู้','Teach everything you know'),S=>{fx({so:4,p:4,b:4});ms(X('มีลูกศิษย์คนแรก','Took a first apprentice'));return X('หลายปีต่อมา เด็กคนนั้นเก่งกว่าคุณเสียอีก คุณภูมิใจมากกว่าตอนเก่งเอง','Years later the child is better than you. It makes you prouder than your own skill ever did.')}),
    opt(X('ไล่ให้ไปเล่นกับเด็กคนอื่น','Send them off to play'),S=>{fx({b:-2});return X('เด็กเดินจากไปเงียบๆ และไม่กลับมาถามอีก','The child walks off quietly and never asks again.')})]},
{id:'a_water',deck:'adult',w:.35,t:X('แย่งแหล่งน้ำ','The fight over water'),
 x:X('ปีแล้งทำให้กลุ่มอื่นเข้ามาใช้แหล่งน้ำของกลุ่มคุณ ทั้งสองฝ่ายถือหอกอยู่ในมือ','The drought brings another band to your water hole. Both sides hold spears.'),
 o:[opt(X('เจรจาแบ่งน้ำกัน','Negotiate to share the water'),S=>{if(rnd()<.55+S.so/200){fx({so:5,p:5});addFriend();return X('ทั้งสองกลุ่มตกลงใช้น้ำคนละวัน ตอนจบฤดูแล้ง คุณมีเพื่อนใหม่ในกลุ่มนั้น','The bands agree to use the water on alternate days. By the end of the drought you have a friend among them.')}fx({h:-10,b:-2});return X('การเจรจาล้มเหลว มีการปะทะกันสั้นๆ ก่อนกลุ่มนั้นจะถอยไป','The talks fail. There is a short clash before they withdraw.')}),
    opt(X('ขู่ไล่ให้ไปที่อื่น','Drive them off'),S=>{fx({p:5});if(rnd()<.35){fx({h:-15});S.inj=1;return X('พวกนั้นสู้กลับ คุณได้แผลลึก','They fight back. You are badly wounded.')}return X('พวกนั้นถอยไปหาแหล่งน้ำอื่น','They back off to find other water.')}),
    opt(X('ยกแหล่งน้ำให้ แล้วย้ายไปที่อื่น','Give up the water hole and move on'),S=>{fx({f:-6,b:2});return X('กลุ่มของคุณเดินทางไกลกว่าเดิม แต่ไม่มีใครต้องบาดเจ็บ','Your band walks farther, but nobody gets hurt.')})]},
{id:'a_storm',deck:'adult',w:1.5,t:X('พายุกลางคืน','Storm in the night'),
 x:X('พายุใหญ่มาตอนกลางคืน ต้นไม้ล้มลงข้างที่พัก หลังคาเริ่มรั่ว','A great storm comes in the night. A tree crashes beside the shelter and the roof begins to leak.'),
 o:[opt(X('ยันเสาที่พักไว้ทั้งคืน','Hold up the shelter poles all night'),S=>{fx({sv:3,b:4,h:-5});return X('แขนคุณล้าจนยกไม่ขึ้น แต่ที่พักไม่ล้มลงมาทับใคร','Your arms give out by dawn, but the shelter never falls on anyone.')}),
    opt(X('พาทุกคนไปหลบใต้หน้าผา','Lead everyone to shelter under the cliff'),S=>{fx({kn:2,p:3});return X('ใต้หน้าผาแห้งและปลอดภัย ทุกคนนั่งฟังพายุจนรุ่งเช้า','Under the cliff it is dry and safe. Everyone listens to the storm until morning.')})]},
{id:'a_weather',deck:'adult',w:3,cond:S=>hasT('eye')||hasT('mem'),t:X('อ่านท้องฟ้า','Reading the sky'),
 x:X('ทุกคนกำลังเตรียมออกล่าไกล แต่คุณสังเกตว่าเมฆและลมวันนี้แปลกไปจากทุกวัน','Everyone is ready for a long hunt, but you notice the clouds and wind are strange today.'),
 o:[opt(X('บอกให้ทุกคนรอก่อน','Tell everyone to wait'),S=>{fx({p:6,kn:3});return X('บ่ายนั้นพายุใหญ่พัดผ่านทุ่งที่ทุกคนจะไป ตั้งแต่นั้นไม่มีใครออกล่าโดยไม่ถามคุณ','That afternoon a great storm sweeps the plain they were heading for. No one hunts without asking you again.')}),
    opt(X('เก็บไว้คนเดียว','Keep it to yourself'),S=>{fx({h:-6,f:-3});return X('ทุกคนถูกพายุซัดกลางทุ่ง กลับมาเปียกและหนาวสั่น','The storm catches everyone in the open. They come home soaked and shivering.')})]},
{id:'a_hand',deck:'adult',w:3,cond:S=>hasT('hand')&&S.cr>=40,t:X('งานชิ้นเอก','A masterpiece'),
 x:X('คุณใช้เวลาทั้งฤดูทำของชิ้นหนึ่งที่ประณีตที่สุดในชีวิต','You spend a whole season making the finest thing of your life.'),
 o:[opt(X('เก็บไว้ให้ลูกหลาน','Keep it for your descendants'),S=>{fx({cr:4,b:4});ms(X('ทำงานชิ้นเอก','Made a masterpiece'));return X('มันถูกส่งต่อในครอบครัวไปอีกหลายชั่วคน','It is handed down in the family for generations.')}),
    opt(X('นำไปแลกกับกลุ่มไกล','Trade it to a distant band'),S=>{addItem('bead',3);fx({cr:3,p:6});addFriend();return X('ชื่อของคุณเดินทางไปไกลกว่าที่ตัวคุณเคยไป','Your name travels farther than you ever will.')})]},
{id:'a_voice',deck:'adult',w:3,cond:S=>hasT('voice'),t:X('เพลงที่ทุกคนร้อง','The song everyone sings'),
 x:X('ในงานชุมนุมใหญ่ มีคนขอให้คุณร้องเพลงต่อหน้าคนหลายกลุ่ม','At a great gathering, someone asks you to sing before many bands.'),
 o:[opt(X('ร้องเพลงเก่าของบรรพบุรุษ','Sing the ancestors’ old song'),S=>{fx({so:4,p:5});addFriend();return X('คนจากกลุ่มอื่นร้องตามได้ เพราะเพลงนี้เก่ากว่าทุกกลุ่ม','People from other bands sing along, because the song is older than any band.')}),
    opt(X('ร้องเพลงใหม่ที่แต่งเอง','Sing a new song of your own'),S=>{fx({so:3,p:6,kn:2});return X('หลายปีต่อมาคุณได้ยินคนแปลกหน้าร้องเพลงของคุณ','Years later you hear strangers singing your song.')})]},
// ---------- ELDER ----------
{id:'e_heir',deck:'elder',w:2,t:X('คนสืบทอด','Who will carry it on'),
 x:X('คุณรู้ว่าเวลาเหลือไม่มาก ความรู้ทั้งหมดที่มีต้องส่งต่อให้ใครสักคน','You know your time is short. Everything you know must pass to someone.'),

function godsFor(S,e,akk){const city=R4[S.rg]?R4[S.rg].g:'enlil';
  let ks=Object.keys(G4).filter(k=>akk?G4[k].ak:G4[k].su);
  if(akk&&e!=='nb')ks=ks.filter(k=>k!=='nabu');if(akk&&!['ob','nb'].includes(e))ks=ks.filter(k=>k!=='marduk');
  if(!akk)ks=ks.filter(k=>k!=='ningirsu'||S.rg==='lag');
  const w=ks.map(k=>[k,k===city?5:(S.rg==='lag'&&k==='nanshe')?3:(S.rg==='bab'&&k==='nabu')?3:1]);return weighted(w)}
function genName4(S,sex,e){e=e||era4(S.ya0);const akk=e==='akk'?rnd()<.7:e==='ob'||e==='nb'?true:(e==='ed'&&S.rg==='kis')?rnd()<.5:rnd()<.08;
  if(akk&&sex==='f'&&e!=='nb'&&rnd()<.15){const w=pick(NWHOLE4);return{l:w.l,th:w.th,c:w.c,mean:w.m}}
  const set=NP4[(e==='nb'?'nb':akk?'ak':'su')+'_'+sex];const p=pick(set);const gk=godsFor(S,e,akk);const g=G4[gk][akk?'ak':'su'];
  const G={th:g[1],d:G4[gk].d};
  return p.pre?{l:p.l+g[0],th:p.th+g[1],c:p.c+g[2],mean:p.m(g[0],G),god:gk}:{l:g[0]+p.l,th:g[1]+p.th,c:g[2]+p.c,mean:p.m(g[0],G),god:gk}}

const NOWRITE=X('ต้องอ่านเขียนได้ หรือมีเงินหนึ่งเชเคิลไว้จ้างอาลักษณ์','You must read and write, or have a shekel to hire a scribe');
function doWrite(S,k){if(S.lit>=35){S.tabN++;S.tabK[k]=(S.tabK[k]||0)+1;return 1}S.ag=Math.max(0,S.ag-1);return 0}
const wOpt=(l,run)=>Object.assign(opt(l,run),{lockF:S=>!canWrite(S),lockT:NOWRITE});

const DEC4=[
/* ----- childhood ----- */
{id:'c4_name',deck:'child',w:3,ch:4,a:[5,9],t:X('ความหมายของชื่อคุณ','What your name means'),
 xf:S=>X('แม่เล่าว่าชื่อ '+S.nm4.th+' ของคุณแปลว่า '+S.nm4.mean.th+' ทุกคนในเมืองมีชื่อที่มีความหมาย และเมื่อคุณรับปันส่วนหรือทำสัญญา อาลักษณ์จะเขียนชื่อนี้ลงบนดินเหนียว','Your mother tells you that your name, '+S.nm4.l+', means '+S.nm4.mean.en+'. Everyone in the city has a name that means something, and when you receive rations or make a contract, a scribe writes it in clay.'),

 o:[opt(X('ภูมิใจในชื่อของตัวเอง','Be proud of your name'),S=>{fx({b:3,so:2});return X('คุณพูดชื่อตัวเองให้ทุกคนฟังทั้งวัน','You tell everyone your name all day long.')}),
    opt(X('ถามว่าเทพองค์นั้นเป็นใคร','Ask who that god is'),S=>{fx({kn:4});return X('แม่พาคุณไปยืนดูรูปเคารพที่ลานวิหาร และเล่าเรื่องของเทพองค์นั้นจนมืด','Your mother takes you to the temple courtyard to look at the god’s image, and tells you stories until dark.')}),
