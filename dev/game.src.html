    opt(X('เอาตราไปกดเล่นบนกำแพงดิน','Take the seal and press it all over the mud wall'),S=>{fx({so:2,b:-1});return X('ทั้งกำแพงเต็มไปด้วยสัตว์เขาเดียว แม่ตีมือคุณ แล้วหัวเราะ','The whole wall fills with one-horned beasts. Your mother smacks your hand, then laughs.')})]},
{id:'c8_dice',deck:'child',w:3,ch:8,a:[5,12],t:X('ลูกเต๋า','The dice'),
 x:X('พี่ชายคนหนึ่งมีลูกเต๋าดินเผาที่มีจุดหกด้าน เด็กๆ ล้อมวงเล่นพนันกันด้วยเมล็ดถั่ว','An older boy has a baked clay die with dots on six sides. The children crowd round to gamble with beans.'),
 n:X('ลูกเต๋าลูกบาศก์ที่มีจุดหนึ่งถึงหกพบในเมืองสินธุหลายแห่ง ถือเป็นลูกเต๋าแบบนี้ที่เก่าที่สุดชุดหนึ่งของโลก นอกจากนี้ยังพบกระดานเกม ลูกแก้ว และของเล่นเด็กจำนวนมาก','Cubic dice with one to six dots have been found at many Indus sites, among the oldest dice of this kind in the world. Game boards, marbles and many children’s toys have also been found.'),
 o:[opt(X('เล่นจนหมดถั่วทุกเม็ด','Play until every bean is gone'),S=>{if(rnd()<.5){fx({so:3,f:1});return X('คุณชนะจนกระเป๋าตุง เด็กคนอื่นไม่ยอมเล่นกับคุณอีก','You win until your pouch bulges, and the others refuse to play with you.')}fx({b:-2});return X('คุณแพ้หมด แล้วต้องบอกแม่ว่าถั่วสำหรับมื้อเย็นหายไปไหน','You lose them all and must tell your mother where the dinner beans went.')}),
    opt(X('ปั้นลูกเต๋าเองจากดินเหนียว','Make your own die from clay'),S=>{fx({cr:3});return X('ลูกเต๋าของคุณเบี้ยวจนออกหกบ่อยเกินไป ทุกคนจับได้','Your die is so lopsided it rolls six far too often, and everyone notices.')}),
    opt(X('ดูอยู่ห่างๆ','Just watch'),S=>{fx({kn:2});return X('คุณสังเกตว่าเด็กที่ชนะบ่อยๆ ไม่ได้โชคดี แต่เลือกเล่นกับคนที่เล่นไม่เป็น','You notice the boy who wins most is not lucky; he picks players who do not know the game.')})]},
{id:'c8_toy',deck:'child',w:3,ch:8,a:[3,8],t:X('เกวียนของเล่น','The toy cart'),
 x:X('พ่อปั้นเกวียนดินเผาเล็กๆ มีล้อหมุนได้ กับวัวโหนกสองตัวลาก ให้คุณ','Your father makes you a little clay cart with wheels that turn, pulled by two humped oxen.'),
 n:X('เกวียนของเล่นดินเผา วัวที่หัวขยับได้ด้วยเชือก และนกหวีดรูปนก พบมากในเมืองสินธุ เกวียนของเล่นเหล่านี้ยังเป็นหลักฐานว่ามีเกวียนจริงที่ใช้วัวลากด้วย','Clay toy carts, oxen whose heads nod on a string and bird-shaped whistles are common finds in Indus cities. The toy carts are also evidence of real ox-carts.'),
 o:[opt(X('ลากเกวียนไปทั่วถนน','Pull it all along the street'),S=>{fx({b:3,h:1});return X('คุณลากไปจนล้อหลุด พ่อซ่อมให้ใหม่โดยไม่บ่นสักคำ','You pull it until a wheel falls off. Your father mends it without a word of complaint.')}),
    opt(X('บรรทุกข้าวสาลีจริงๆ ไปให้ยาย','Carry real wheat to your grandmother in it'),S=>{fx({b:5});return X('ได้แค่กำมือเดียว แต่ยายเล่าให้ทุกคนฟังว่าหลานส่งข้าวมาให้','It holds only a handful, but your grandmother tells everyone her grandchild brought her grain.')})]},
{id:'c8_drain',deck:'child',w:3,ch:8,a:[6,12],cond:S=>S.rg!=='vil',t:X('ท่อใต้ถนน','The drain under the street'),
 x:X('เพื่อนทำลูกบอลหล่นลงช่องท่อระบายน้ำข้างถนน ฝาอิฐยกขึ้นได้ และข้างใต้มีน้ำเสียไหลอยู่','A friend drops a ball down the drain beside the street. The brick lid lifts, and dirty water flows underneath.'),
 n:X('เมืองสินธุมีระบบระบายน้ำที่ดีที่สุดในโลกยุคนั้น น้ำจากห้องอาบน้ำและห้องส้วมในบ้านไหลลงท่ออิฐที่มีฝาปิดใต้ถนน และมีบ่อพักให้คนมาลอกตะกอน','Indus cities had the best drainage of their time. Water from bathrooms and latrines in houses ran into covered brick drains under the streets, with sumps where workers could clear out the silt.'),
 o:[opt(X('ล้วงลงไปหยิบ','Reach down and grab it'),S=>{if(rnd()<.35){fx({h:-4});return X('คุณได้ลูกบอลคืน แต่ท้องเสียไปสามวัน','You get the ball back, and a stomach upset for three days.')}fx({so:2});return X('คุณได้ลูกบอลคืน เปื้อนไปถึงศอก','You get the ball back, filthy to the elbow.')}),
    opt(X('ไปตามคนลอกท่อ','Fetch the drain-cleaner'),S=>{fx({b:2,kn:2});return X('คนลอกท่อใช้ไม้ขอเกี่ยวลูกบอลขึ้นมา แล้วเล่าว่าเขาเคยเจอแหวนทองในบ่อพัก','The drain-cleaner hooks it out with a pole and tells you he once found a gold ring in a sump.')})]},
{id:'c8_bangle',deck:'child',w:3,ch:8,a:[6,13],t:X('กำไลเปลือกหอย','Shell bangles'),
 x:X('ป้าใส่กำไลเปลือกหอยขาวเต็มแขน วันนี้กำไลวงหนึ่งแตก ป้าบอกว่ามันมาจากทะเลไกลทางใต้','Your aunt wears white shell bangles all up her arms. Today one breaks, and she says it came from the sea far to the south.'),
 n:X('กำไลจากเปลือกหอยทะเล ดินเผา และดินเผาเคลือบ เป็นเครื่องประดับที่พบบ่อยที่สุดอย่างหนึ่งของอารยธรรมสินธุ ทั้งผู้หญิงและผู้ชายใส่ ที่บาลาโกตริมทะเลอาหรับมีโรงทำกำไลเปลือกหอย ผู้หญิงในเอเชียใต้ทุกวันนี้ยังใส่กำไลเต็มแขน','Bangles of sea shell, terracotta and faience are among the most common Indus ornaments, worn by women and men. At Balakot on the Arabian Sea there were workshops making shell bangles. Women in South Asia still wear armfuls of bangles today.'),
 o:[opt(X('ขอเศษกำไลไปเก็บ','Ask to keep the broken pieces'),S=>{fx({b:2,kn:1});return X('คุณร้อยเศษกำไลเป็นสร้อย และใส่ไปทุกที่','You string the pieces into a necklace and wear it everywhere.')}),
    opt(X('ถามว่าทะเลอยู่ไกลแค่ไหน','Ask how far the sea is'),S=>{fx({kn:3});return X('ป้าบอกว่าเรือต้องล่องแม่น้ำหลายสิบวัน คุณตั้งใจว่าวันหนึ่งจะไปเห็นให้ได้','She says it is many tens of days down the river by boat. You decide that one day you will see it.')})]},
/* ----- youth ----- */
{id:'y8_signs',deck:'youth',w:4,ch:8,a:[12,18],cond:S=>S.cls!=='dep',t:X('ศิษย์ของช่างแกะตรา','The seal-cutter’s pupil'),
 x:X('ช่างแกะตราในย่านต้องการลูกมือ เขาบอกว่าคนที่จะแกะตราได้ ต้องจำตัวอักษรได้หลายร้อยตัว และรู้ว่าตัวไหนอยู่คู่กับตัวไหน','The seal-cutter of your quarter needs a pupil. He says that to cut seals you must remember hundreds of signs and know which go together.'),
 n:X('ตัวอักษรสินธุที่รู้จักมีหลายร้อยตัว จารึกที่พบมีมากกว่า 5,000 ชิ้น แต่ส่วนใหญ่สั้นมาก โดยเฉลี่ยแค่ราว 4 ถึง 5 ตัว ยังไม่พบจารึกสองภาษา และยังไม่รู้ว่าภาษาที่เขียนเป็นภาษาอะไร จึงยังไม่มีใครอ่านออก แม้จะมีคนอ้างว่าถอดได้หลายร้อยครั้งแล้วก็ตาม','Several hundred Indus signs are known, on more than 5,000 inscriptions, but most are very short, on average only about four or five signs. No bilingual text has been found, and the language is unknown, so no one can read it, despite hundreds of claimed decipherments.'),
 o:[opt(X('ไปเป็นศิษย์','Become his pupil'),S=>{S.schOK=1;S.sig=clamp(S.sig+10,0,100);fx({kn:4});return X('นิ้วคุณเต็มไปด้วยรอยมีด แต่ตอนสิ้นปี คุณแกะสัตว์เขาเดียวตัวแรกได้','Your fingers are covered in knife nicks, but by the year’s end you have carved your first one-horned beast.')}),
    opt(X('อยู่ช่วยงานที่บ้าน','Stay and help at home'),S=>{fx({b:3,f:2});return X('ครอบครัวดีใจที่ได้แรงงานเพิ่ม คุณสงสัยไปอีกนานว่าตัวอักษรพวกนั้นพูดว่าอะไร','Your family is glad of the extra hands. For a long time you wonder what those signs say.')})]},
{id:'y8_bead',deck:'youth',w:4,ch:8,a:[12,20],t:X('ลูกปัดเม็ดยาว','The long bead'),
 x:X('ช่างลูกปัดให้คุณลองเจาะรูลูกปัดคาร์เนเลียนเม็ดยาวด้วยสว่านหิน เขาบอกว่าลูกปัดเม็ดนี้เม็ดเดียวต้องเจาะหลายวัน และพลาดนิดเดียวก็แตก','The bead-maker lets you try drilling a long carnelian bead with a stone drill. He says this one bead takes days to drill, and one slip will split it.'),
 n:X('ช่างสินธุทำลูกปัดคาร์เนเลียนเม็ดยาวโดยใช้สว่านปลายหินแข็งพิเศษ ลูกปัดยาวบางเม็ดอาจใช้เวลาเจาะเป็นสัปดาห์ ลูกปัดแบบนี้และลูกปัดที่ฟอกลายขาวถูกส่งไปไกลถึงเมโสโปเตเมีย และพบในสุสานหลวงที่อูร์','Indus craftsmen made long carnelian beads using drills tipped with a special hard stone. A long bead could take a week or more to drill. Beads like these, and carnelian beads etched with white patterns, travelled as far as Mesopotamia and were found in the Royal Cemetery at Ur.'),
 o:[opt(X('เจาะอย่างอดทน หยดน้ำทีละนิด','Drill patiently, a drop of water at a time'),S=>{if(rnd()<.6){fx({cr:5});addItem('cbead');return X('รูทะลุอีกด้านตรงกลางพอดี ช่างหยิบลูกปัดขึ้นมาส่องแดด แล้วยิ้ม','The hole comes out dead centre on the other side. The bead-maker holds it up to the sun and smiles.')}fx({cr:2,b:-1});return X('ลูกปัดแตกเป็นสองท่อนในวันที่สาม ช่างบอกว่าทุกคนเคยแตกมาแล้วทั้งนั้น','On the third day the bead splits in two. The bead-maker says everyone has split one.')}),
    opt(X('ขอทำลูกปัดดินเผาแทน','Ask to make clay beads instead'),S=>{fx({cr:2});return X('คุณทำได้วันละร้อยเม็ด แต่ไม่มีใครอยากแลกด้วยของดีๆ','You make a hundred a day, but no one will trade anything good for them.')})]},
{id:'y8_marry',deck:'youth',w:4,ch:8,a:[16,26],cond:S=>!pp('partner'),t:X('สร้างครอบครัว','Founding a house'),
 x:X('สองครอบครัวคุยกันว่าคุณควรแต่งงานกับลูกของบ้านช่างปั้นหม้อในถนนถัดไป','The two families talk of marrying you to the child of the potters in the next street.'),
 n:X('เราไม่รู้ว่าชาวสินธุแต่งงานกันอย่างไร เพราะอ่านตัวอักษรไม่ออก สิ่งที่รู้มาจากบ้าน สุสาน และสิ่งของเท่านั้น ตุ๊กตาดินเผาบางตัวแสดงผู้หญิงใส่กำไลเต็มแขนและสร้อยหลายเส้น ซึ่งอาจเป็นเครื่องแต่งกายในพิธี','We do not know how Indus people married, since we cannot read their writing; what we know comes only from houses, graves and objects. Some clay figurines show women with armfuls of bangles and many necklaces, which may have been festive or ritual dress.'),
 o:[opt(X('ตกลง','Agree'),S=>{S.partner=1;mkP('partner',S.age);fx({b:6});ms(X('สร้างครอบครัวใหม่','Founded a new household'));return X('งานแต่งมีขนมงาและนมเปรี้ยว ทั้งสองถนนร้องเพลงจนดึก','The wedding has sesame cakes and curds, and both streets sing late into the night.')}),
    opt(X('ขอรอไปก่อน','Ask to wait'),S=>{S.later=1;fx({b:-1});return X('ครอบครัวบ่น แต่ยอมรอ','The families grumble, but agree to wait.')})]},
/* ----- adulthood ----- */
{id:'a8_weights',deck:'adult',w:4,ch:8,a:[18,55],t:X('ตุ้มที่เบากว่า','The lighter weight'),
 x:X('พ่อค้าคนหนึ่งยื่นตุ้มหินมาให้คุณดู มันดูเหมือนตุ้มมาตรฐานทุกอย่าง แต่เบากว่านิดหนึ่ง เขาบอกว่า “ใช้ตอนรับซื้อ ไม่มีใครรู้หรอก”','A merchant shows you a stone weight. It looks exactly like a standard one, but it is a little lighter. “Use it when you buy,” he says. “No one will ever know.”'),
 n:X('ตุ้มน้ำหนักสินธุมีขนาดเกือบเท่ากันทุกลูก ทั้งในเมืองต่างๆ และตลอดหลายร้อยปี นักโบราณคดีวัดตุ้มหลายร้อยลูกจากหลายชั้นดินที่โมเฮนโจ-ดาโร แล้วแทบไม่พบความต่าง แสดงว่ามีการควบคุมมาตรฐานอย่างเข้มงวด แม้ไม่รู้ว่าใครเป็นผู้ควบคุม','Indus weights were almost exactly the same everywhere and for centuries. Archaeologists measured hundreds from many layers at Mohenjo-daro and found hardly any difference, a sign of strict control of the standard, though we do not know who enforced it.'),
 o:[opt(X('ปฏิเสธ','Refuse'),S=>{fx({p:3,b:2});return X('พ่อค้ายักไหล่ แล้วเดินไปหาคนอื่น ปีต่อมาคุณได้ยินว่าเขาถูกไล่ออกจากตลาด','The merchant shrugs and moves on. A year later you hear he was thrown out of the market.')}),
    opt(X('รับไว้ใช้','Take it and use it'),S=>{if(rnd()<.4){fx({p:-8,b:-4});return X('คนชั่งของประจำตลาดเทียบตุ้มของคุณกับตุ้มของเขา แล้วหักตุ้มของคุณต่อหน้าทุกคน','The market’s weigher sets your weight against his, and breaks yours in front of everyone.')}S.ag+=2;return X('คุณได้กำไรเพิ่ม แต่ทุกครั้งที่ยกตาชั่ง มือคุณเย็นเฉียบ','You make extra profit, but every time you lift the scales your hands go cold.')})]},
{id:'a8_meluhha',deck:'adult',w:4,ch:8,a:[18,50],cond:S=>['m1','m2'].includes(era8(S.ya))&&(S.car==='merchant'||S.car==='boatman'||S.car==='bead'||['lot','moh','dho'].includes(S.rg)),t:X('เรือไปแดนตะวันตก','The ship to the west'),
 x:X('เรือบรรทุกลูกปัดคาร์เนเลียน งาช้าง และไม้ จะออกทะเลไปเกาะดิลมุนและไกลกว่านั้น ถึงแผ่นดินที่คนพูดภาษาที่ไม่มีใครเข้าใจ','A ship loaded with carnelian beads, ivory and timber will sail to the island of Dilmun and beyond, to a land where people speak a tongue no one understands.'),
 n:X('ตราประทับสินธุพบในเมโสโปเตเมีย และแผ่นดินเหนียวที่นั่นพูดถึง “หมู่บ้านเมลูฮา” ในดินแดนอัคคัด ที่ผู้คนถูกเรียกว่า “ลูกของเมลูฮา” ตราประทับทรงกระบอกของชายชื่อชู-อิลิชู ราว 2200–2100 ปีก่อนคริสตกาล ระบุว่าเขาเป็นล่ามภาษาเมลูฮา','Indus seals have been found in Mesopotamia, and tablets there mention a “Meluhha village” in Akkad whose people were called “sons of Meluhha”. The cylinder seal of a man named Shu-ilishu, about 2200–2100 BCE, names him as an interpreter of the Meluhhan language.'),
 o:[opt(X('ลงเรือไปด้วย','Sail with it'),S=>{if(rnd()<.15){fx({h:-10});S.yr+=.08;return X('พายุกลางทะเลพัดเรืออีกลำล่ม คุณรอดมาได้แต่ป่วยหนักตลอดทาง','A storm at sea sinks another ship. You survive, but are gravely ill all the way.')}S.ag+=5;S.meluhha=1;fx({kn:6,so:4});ms(X('ล่องเรือถึงแดนเมโสโปเตเมีย','Sailed to Mesopotamia'));return X('ที่ท่าเรือแดนไกล คุณเจอคนจากบ้านเกิดที่ตั้งรกรากอยู่ที่นั่นแล้ว และล่ามชื่อชู-อิลิชูช่วยคุณต่อราคา','In the faraway port you meet people from home who have settled there, and an interpreter named Shu-ilishu helps you bargain.')}),
    opt(X('ฝากสินค้าไปกับเรือ','Send goods with the ship'),S=>{if(S.ag>=2){S.ag-=2;if(rnd()<.7){S.ag+=5;return X('เรือกลับมาพร้อมเงิน ขนแกะ และเรื่องเล่าเกี่ยวกับเมืองที่ใหญ่กว่าเมืองไหนๆ','The ship returns with silver, wool and stories of cities bigger than any you know.')}return X('เรือไม่กลับมาอีกเลย','The ship never comes back.')}fx({so:1});return X('คุณไม่มีอะไรจะฝาก ได้แต่ยืนดูเรือแล่นออกไป','You have nothing to send, and can only watch the ship sail away.')}),
    opt(X('อยู่บ้าน','Stay home'),S=>{fx({b:3});return X('คุณได้ยินเรื่องแดนตะวันตกจากคนเรือที่กลับมา และนั่นก็พอแล้ว','You hear about the west from the sailors who return, and that is enough.')})]},
{id:'a8_leper',deck:'adult',w:3,ch:8,a:[20,60],cond:S=>['m2','late'].includes(era8(S.ya)),t:X('เพื่อนบ้านที่ถูกไล่ไป','The neighbour sent away'),
 x:X('เพื่อนบ้านคนหนึ่งมีแผลที่มือและหน้าที่ไม่ยอมหาย คนในถนนเริ่มไม่ยอมให้เขาใช้บ่อน้ำร่วมกัน และพูดกันว่าควรให้เขาไปอยู่นอกเมือง','A neighbour has sores on his hands and face that will not heal. People in the street stop letting him use the shared well and say he should live outside the town.'),
 n:X('หลักฐานโรคเรื้อนในโครงกระดูกที่เก่าที่สุดในเอเชียใต้มาจากฮารัปปา ราว 2000 ปีก่อนคริสตกาล การศึกษาพบว่าคนที่ถูกฝังนอกสุสานหลักของเมือง มีร่องรอยโรคและการบาดเจ็บจากความรุนแรงสูงกว่ามาก ซึ่งอาจแสดงว่าคนป่วยและคนชายขอบถูกกีดกันในช่วงที่เมืองกำลังเสื่อม','The oldest skeletal evidence of leprosy in South Asia comes from Harappa, about 2000 BCE. Studies found that people buried outside the city’s formal cemeteries had far higher rates of disease and injuries from violence, which may show that the sick and marginal were pushed aside as the cities declined.'),
 o:[opt(X('นำอาหารไปให้เขาทุกวัน','Take him food every day'),S=>{fx({b:4,p:-2});if(rnd()<.06){S.yr+=.03}return X('คนในถนนมองคุณแปลกๆ แต่ชายคนนั้นจำคุณได้ไปจนตาย','People in the street look at you oddly, but the man remembers you until he dies.')}),
    opt(X('ทำตามที่คนในถนนตกลงกัน','Go along with the street'),S=>{fx({so:1,b:-2});return X('เขาย้ายไปอยู่ในเพิงนอกกำแพง และไม่มีใครเห็นเขาอีกเลย','He moves to a shelter outside the wall, and no one sees him again.')})]},
{id:'a8_leave',deck:'adult',w:5,ch:8,a:[20,60],cond:S=>era8(S.ya)==='late'&&S.rg!=='vil'&&!S.left8,t:X('ย้ายออกจากเมือง','Leaving the city'),
 x:X('บ่อน้ำในย่านคุณแห้งไปสองบ่อ ครอบครัวหลายบ้านย้ายไปทางตะวันออก ที่ซึ่งได้ยินว่าฝนยังตกตามฤดูและที่ดินยังว่าง','Two wells in your quarter have run dry. Many families have moved east, where they say the rains still come and land is free.'),
 n:X('ในยุคฮารัปปาตอนปลาย จำนวนหมู่บ้านทางตะวันออก ในแคว้นหรยาณาและอุตตรประเทศทุกวันนี้ เพิ่มขึ้นมาก ขณะที่เมืองใหญ่ทางตะวันตกหดลง คนสินธุไม่ได้หายไป วัฒนธรรมและผู้คนของพวกเขาเป็นส่วนหนึ่งของบรรพบุรุษคนเอเชียใต้ทุกวันนี้','In the Late Harappan period the number of villages in the east, in today’s Haryana and Uttar Pradesh, grew sharply while the great western cities shrank. The Indus people did not vanish: they are among the ancestors of South Asians today.'),
 o:[opt(X('ย้ายไปทางตะวันออก','Move east'),S=>{S.left8=1;S.field=1;fx({b:-3,f:4});ms(X('ย้ายจากเมืองไปตั้งหมู่บ้านทางตะวันออก','Left the city for a village in the east'));return X('คุณเดินพร้อมวัวโหนกและลูกๆ หลายสิบวัน แล้วถางป่าทำนาใหม่ ไม่มีใครที่นั่นใช้ตราประทับอีกแล้ว','You walk for many days with your cattle and children, then clear forest for new fields. No one there uses seals any more.')}),
    opt(X('อยู่ต่อในเมืองที่กำลังเงียบลง','Stay in the quieting city'),S=>{fx({b:2,f:-3});return X('คุณย้ายเข้าไปอยู่ในบ้านใหญ่ที่ถูกทิ้งร้าง ตอนกลางคืนเมืองเงียบจนได้ยินเสียงแม่น้ำ','You move into a big abandoned house. At night the city is so quiet you can hear the river.')})]},
{id:'a8_sick',deck:'adult',w:3,ch:8,a:[20,50],cond:S=>S.kids.some(k=>k.dies==null),t:X('ลูกป่วย','A sick child'),
 x:X('ลูกของคุณไข้ขึ้นมาสามวันแล้ว เพื่อนบ้านแนะนำต่างกันไป','Your child has had a fever for three days. The neighbours all give different advice.'),
 n:X('เราไม่รู้ว่าชาวสินธุรักษาโรคอย่างไร แต่เครื่องราง ตุ๊กตาดินเผา และสิ่งของที่อาจใช้ในพิธีพบอยู่ในบ้านทั่วไป ทันตกรรมที่เก่าที่สุดที่รู้จักชิ้นหนึ่ง ฟันที่ถูกเจาะเมื่อราว 9,000 ถึง 7,500 ปีก่อน มาจากเมห์รการห์ หมู่บ้านบรรพบุรุษของวัฒนธรรมนี้','We do not know how Indus people treated illness, but amulets, clay figurines and objects that may have been used in rites are found in ordinary houses. Some of the oldest known dentistry, teeth drilled some 9,000 to 7,500 years ago, comes from Mehrgarh, a village ancestral to this culture.'),
 o:[opt(X('ทำพิธีที่ซุ้มในบ้าน','Make offerings at the household niche'),S=>{relF('fig')(S);fx({b:3});return X('คุณวางตุ๊กตาดินเผาไว้ข้างเปลือกหอยที่ใส่ไฟ แล้วอยู่ข้างลูกทั้งคืน ไข้ค่อยๆ ลดลงในวันรุ่งขึ้น','You set a clay figurine beside a shell lamp and stay by your child all night. The fever slowly breaks the next day.')}),
    opt(X('ห้อยเครื่องรางลูกปัด','Tie on a bead amulet'),S=>{fx({b:2});return X('ลูกเล่นเครื่องรางไปมาจนหลับ ตื่นเช้ามาตัวเย็นลง','Your child plays with the amulet until falling asleep and wakes cooler in the morning.')}),
    opt(X('พาไปหาหญิงชราที่รู้เรื่องสมุนไพร','Take the child to the old woman who knows herbs'),S=>{fx({kn:2,b:2});return X('หญิงชราต้มใบไม้ขมๆ ให้ดื่ม และบอกให้ดื่มน้ำต้มสุกเท่านั้น','The old woman boils bitter leaves into a drink and says to give only boiled water.')})]},
/* ----- elder ----- */
{id:'e8_signs',deck:'elder',w:3,ch:8,a:[45,85],t:X('ตัวอักษรที่หายไป','The fading signs'),
 xf:S=>era8(S.ya)==='late'?X('หลานๆ ไม่รู้จักตัวอักษรบนตราประทับเก่าของครอบครัวแล้ว ไม่มีใครแกะตราใหม่อีก','Your grandchildren no longer know the signs on the family’s old seal. No one cuts new seals any more.'):X('หลานถามว่าตัวอักษรบนตราของครอบครัวอ่านว่าอะไร','A grandchild asks what the signs on the family seal say.'),
 n:X('หลังราว 1900 ปีก่อนคริสตกาล ตัวอักษรสินธุเลิกใช้ และหายไปจากความทรงจำ อักษรที่ใช้ในอินเดียครั้งต่อมา คืออักษรพราหมี ปรากฏอีกราว 1,600 ปีให้หลัง ในจารึกของพระเจ้าอโศก และยังไม่รู้ว่าทั้งสองเกี่ยวข้องกันหรือไม่','After about 1900 BCE the Indus script fell out of use and was forgotten. The next script used in India, Brahmi, appears some 1,600 years later, in the inscriptions of the emperor Ashoka, and it is not known whether the two are related.'),
 o:[opt(X('สอนเท่าที่จำได้','Teach what you remember'),S=>{fx({b:5,kn:1});return X('หลานวาดตัวอักษรตามคุณบนพื้นดิน บางตัวเพี้ยนไป แต่คุณไม่แก้','The child copies the signs in the dust. Some come out wrong, but you do not correct them.')}),
    opt(X('เล่าเรื่องสมัยที่เมืองยังคึกคัก','Tell of the days when the city was busy'),S=>{fx({b:6,so:2});return X('คุณเล่าเรื่องตลาด เรือ และสระน้ำใหญ่ หลานฟังเหมือนฟังนิทาน','You tell of markets, ships and the Great Bath, and the child listens as if to a fairy tale.')})]}
];

/* ---------- chapter 08 career decisions ---------- */
const DEC_CAR8=[
{id:'k8_seal',a:[16,60],w:5,ch:8,cond:S=>S.car==='seal',t:X('ตราของพ่อค้า','The merchant’s seal'),
 x:X('พ่อค้าใหญ่สั่งแกะตราใหม่ เขาอยากได้สัตว์เขาเดียว กับตัวอักษรห้าตัวที่ไม่เคยมีใครใช้มาก่อน','A great merchant orders a new seal. He wants the one-horned beast and five signs that no one has used before.'),
 n:X('สัตว์เขาเดียวยืนหน้าแท่นคล้ายที่ตั้งเครื่องหอม เป็นลายที่พบบ่อยที่สุดบนตราประทับสินธุ ยังถกเถียงกันว่ามันเป็นสัตว์ในจินตนาการ เป็นวัวที่วาดด้านข้างจนเห็นเขาเดียว หรือเป็นสัญลักษณ์ของกลุ่มคน','The one-horned beast standing before a stand like an incense burner is the most common design on Indus seals. Scholars still argue whether it is an imaginary animal, a bull drawn in profile so only one horn shows, or the emblem of a group of people.'),
 o:[opt(X('แกะตามที่สั่งอย่างประณีต','Carve it as ordered, with great care'),S=>{S.sealN+=1;fx({cr:4,p:3});S.ag+=2;return X('ตราออกมาคมจนเห็นขนคอของสัตว์ พ่อค้าจ่ายด้วยงาช้างชิ้นใหญ่','The seal comes out so sharp you can see the beast’s neck folds. The merchant pays with a large piece of ivory.')}),
    opt(X('แนะนำให้ใช้ตัวอักษรที่คนรู้จัก','Suggest signs people already know'),S=>{S.sealN+=1;fx({kn:3,so:2});return X('พ่อค้าคิดอยู่นาน แล้วยอมทำตาม ตราของเขาอ่านง่ายจนคนทั้งท่าเรือจำได้','The merchant thinks for a long while, then agrees. His seal is so easy to read that the whole harbour knows it.')})]},
{id:'k8_cast',a:[16,60],w:5,ch:8,cond:S=>S.car==='copper',t:X('รูปหล่อขี้ผึ้ง','The wax figure'),
 x:X('คุณปั้นรูปหญิงสาวยืนเอามือเท้าสะเอวด้วยขี้ผึ้ง จะหุ้มด้วยดินแล้วหล่อเป็นสำริด ถ้าดินแตกตอนเทโลหะ ทุกอย่างพังหมด','You model a young woman standing with a hand on her hip in wax, to cover in clay and cast in bronze. If the clay cracks when the metal goes in, it is all lost.'),
 n:X('“หญิงสาวนักเต้นรำ” จากโมเฮนโจ-ดาโร รูปหล่อสำริดสูงราว 10.5 เซนติเมตร อายุราว 2500 ปีก่อนคริสตกาล ทำด้วยวิธีหล่อขี้ผึ้งหาย ชื่อนี้นักโบราณคดียุคอาณานิคมตั้งให้ เราไม่รู้ว่าเธอเป็นใครหรือกำลังทำอะไร ปัจจุบันอยู่ที่พิพิธภัณฑ์แห่งชาติ นิวเดลี','The “Dancing Girl” of Mohenjo-daro is a bronze figure about 10.5 cm tall from about 2500 BCE, made by lost-wax casting. The name was given by colonial-era archaeologists; we do not know who she is or what she is doing. She is now in the National Museum, New Delhi.'),
 o:[opt(X('เทโลหะช้าๆ','Pour slowly'),S=>{if(rnd()<.65){fx({cr:5,p:3});addItem('bronze');return X('รูปหล่อออกมาสมบูรณ์ ทั้งกำไลเต็มแขนซ้ายและผมมวยที่บิดเบี้ยวนิดๆ','The figure comes out whole, down to the armful of bangles and the slightly crooked bun.')}fx({cr:2});return X('แม่พิมพ์แตก โลหะไหลออกมาเป็นก้อน คุณต้องเริ่มปั้นขี้ผึ้งใหม่','The mould cracks and the metal runs out in a lump. You must model the wax again.')}),
    opt(X('หล่อเป็นขวานแทน','Cast an axe instead'),S=>{fx({cr:2});S.ag+=1;return X('ขวานทองแดงขายได้ทันที แต่คุณยังคิดถึงรูปหญิงสาวที่ไม่ได้หล่อ','The copper axe sells at once, but you keep thinking of the figure you never cast.')})]},
{id:'k8_field',a:[16,60],w:5,ch:8,cond:S=>S.car==='farmer',t:X('ไถสองทาง','Ploughing both ways'),
 x:X('พ่อสอนให้ไถนาเป็นร่องตามยาว แล้วไถอีกครั้งตามขวาง ปลูกถั่วในร่องหนึ่ง และมัสตาร์ดในอีกร่องหนึ่ง','Your father teaches you to plough furrows lengthwise, then plough again across, sowing gram in one set and mustard in the other.'),
 n:X('ทุ่งนาที่กาลีบังกันจากยุคต้น ราว 2800 ปีก่อนคริสตกาล มีร่องไถไขว้กันเป็นตาราง เป็นทุ่งไถที่เก่าที่สุดแห่งหนึ่งที่ขุดพบ ชาวนาในราชสถานทุกวันนี้ยังไถแบบนี้เพื่อปลูกพืชสองชนิดในแปลงเดียว','The field at Kalibangan from the early period, about 2800 BCE, has furrows crossing in a grid, one of the oldest ploughed fields ever excavated. Farmers in Rajasthan still plough this way to grow two crops in one field.'),
 o:[opt(X('ทำตามที่พ่อสอน','Do it your father’s way'),S=>{fx({f:6,kn:2});return X('ปีนั้นมีทั้งถั่วและมัสตาร์ด แม้ฝนจะน้อย ครอบครัวก็ไม่หิว','That year there is both gram and mustard, and though the rain is thin, the family does not go hungry.')}),
    opt(X('ปลูกข้าวสาลีอย่างเดียวเต็มแปลง','Sow the whole field with wheat'),S=>{if(rnd()<.5){fx({f:8});return X('ฝนมาดี ข้าวสาลีออกรวงเต็มนา','The rain is good and the wheat stands thick.')}fx({f:-5});return X('ฝนน้อย ข้าวสาลีแห้งตาย และไม่มีอะไรมาแทน','The rain fails, the wheat dies, and there is nothing to fall back on.')})]},
{id:'k8_kiln',a:[16,60],w:5,ch:8,cond:S=>S.car==='builder',t:X('อิฐขนาดมาตรฐาน','Standard bricks'),
 x:X('เจ้าของบ้านหลังใหญ่อยากได้อิฐที่ใหญ่กว่าปกติ ให้บ้านดูโดดเด่นกว่าใคร แต่หัวหน้าช่างบอกว่าอิฐต้องเป็นขนาดเดียวกับที่ทุกเมืองใช้','The owner of a big house wants bricks larger than usual, so his house stands out. But the master builder says bricks must be the size every town uses.'),
 n:X('อิฐของอารยธรรมสินธุ ทั้งอิฐดิบและอิฐเผา มีสัดส่วนความหนา กว้าง ยาว 1:2:4 เหมือนกันเกือบทุกเมือง ทำให้ก่ออิฐสลับแนวได้แข็งแรง และสะท้อนว่ามีมาตรฐานร่วมกันทั่วดินแดนกว้างใหญ่','Indus bricks, both mud and baked, had thickness, width and length in the ratio 1:2:4 in almost every town. This made strong bonded walls possible, and reflects a shared standard across a vast area.'),
 o:[opt(X('ทำตามมาตรฐาน','Keep to the standard'),S=>{fx({cr:3,p:2});return X('บ้านหลังนั้นดูเหมือนบ้านทุกหลัง และยืนอยู่จนหลานของเจ้าของแก่ตาย','The house looks like every other house, and stands until the owner’s grandchildren grow old.')}),
    opt(X('ทำอิฐใหญ่ตามสั่ง','Make the big bricks he wants'),S=>{S.ag+=2;fx({p:-3});return X('ได้ค่าจ้างงาม แต่อิฐใหญ่ก่อกับอิฐปกติไม่สนิท กำแพงร้าวในฤดูฝนแรก','The pay is good, but the big bricks will not bond with normal ones, and the wall cracks in the first monsoon.')})]},
{id:'k8_rite',a:[16,60],w:5,ch:8,cond:S=>S.car==='ritual',t:X('น้ำเพื่อชำระ','Water for cleansing'),
 x:X('ก่อนวันสำคัญ ผู้คนจากทั่วเมืองมารอลงสระน้ำ บางคนบอกว่าต้องชำระร่างกายก่อนเข้าพิธี บางคนบอกว่าแค่ร้อน','Before the great day, people from all over the city wait to go down into the bath. Some say the body must be cleansed before the rites; some say it is just hot.'),
 n:X('ไม่มีใครรู้แน่ว่าชาวสินธุมีนักบวชหรือไม่ แต่การให้ความสำคัญกับน้ำและความสะอาดเห็นได้ชัด ทั้งสระน้ำใหญ่ ห้องอาบน้ำในบ้านเกือบทุกหลัง และบ่อน้ำหลายร้อยบ่อ นักวิชาการหลายคนเชื่อมโยงสิ่งนี้กับพิธีชำระล้างในศาสนาของเอเชียใต้ในยุคหลัง แต่เป็นการตีความ','No one knows whether the Indus had priests, but their care for water and cleanliness is clear: the Great Bath, a bathing room in almost every house, hundreds of wells. Many scholars link this to the purifying baths of later South Asian religions, but this is interpretation.'),
 o:[opt(X('ให้ทุกคนลงสระตามลำดับ','Let everyone go down in turn'),S=>{relF('bath')(S);fx({so:4,p:2});return X('ทั้งวันคุณยืนดูคนลงบันไดฝั่งหนึ่ง และขึ้นอีกฝั่งหนึ่ง เหมือนแม่น้ำที่ไหลผ่านเมือง','All day you watch people go down one stair and up the other, like a river flowing through the city.')}),
    opt(X('ให้เฉพาะคนจากบ้านใหญ่ลงก่อน','Let the big houses go first'),S=>{relF('bath')(S);S.ag+=2;fx({so:-2});return X('บ้านใหญ่ส่งของขวัญมาให้ คนจากบ้านเล็กรอจนน้ำขุ่น','The big houses send gifts. The people of the small houses wait until the water is cloudy.')})]},
{id:'k8_boat',a:[16,60],w:5,ch:8,cond:S=>S.car==='boatman'||S.car==='merchant',t:X('แม่น้ำย้ายทาง','The river moves'),
 x:X('หลังน้ำท่วมใหญ่ แม่น้ำสายหลักย้ายทางไปทางตะวันตกหลายกิโลเมตร ท่าเรือเก่ากลายเป็นแอ่งโคลน','After a great flood the main river shifts its course several kilometres west. The old landing becomes a mud flat.'),
 n:X('แม่น้ำในที่ราบลุ่มสินธุเปลี่ยนเส้นทางบ่อยครั้ง เพราะพาตะกอนมาก แม่น้ำฆัคคระ-หักระทางตะวันออก ซึ่งเคยมีชุมชนสินธุหนาแน่น แห้งลงมากในช่วงนี้ นักวิชาการเชื่อว่าการย้ายทางของแม่น้ำมีส่วนทำให้เมืองต่างๆ ถูกทิ้ง','Rivers on the Indus plain often changed course because they carried so much silt. The Ghaggar-Hakra river in the east, once dense with Indus settlements, dried up a great deal during this time. Scholars think shifting rivers helped cause towns to be abandoned.'),
 o:[opt(X('ตามแม่น้ำไปตั้งท่าใหม่','Follow the river and set up a new landing'),S=>{fx({b:-2,sv:3});S.ag+=1;return X('คุณกับคนเรืออีกสิบกว่าคนสร้างท่าใหม่ด้วยไม้และกก ภายในปีเดียวมีคนมาตั้งตลาด','You and a dozen boatmen build a new landing of wood and reeds. Within a year a market has grown there.')}),
    opt(X('รอให้แม่น้ำกลับมา','Wait for the river to come back'),S=>{fx({f:-4});return X('แม่น้ำไม่กลับมา คุณรอสองฤดูกว่าจะยอมย้าย','The river does not come back. You wait two seasons before you give up and move.')})]}
];

/* ---------- chapter 08 events ---------- */
const E8=e=>Object.assign({ch:8},e);
const EV8=[
E8({a:[3,12],w:2,x:X('คุณกับเพื่อนวิ่งเล่นบนหลังคาบ้านที่เชื่อมกันเป็นแถว จนแม่ตะโกนเรียกลงมากินข้าว','You and your friends race across the joined rooftops until your mother shouts for you to come down and eat.'),fx:{b:2}}),
E8({a:[3,10],w:1.5,x:X('พ่อให้นกหวีดดินเผารูปนกกับคุณ คุณเป่าจนหมาทั้งถนนเห่า','Your father gives you a clay whistle shaped like a bird. You blow it until every dog in the street barks.'),n:X('นกหวีดดินเผา ตุ๊กตาสัตว์ที่หัวขยับได้ และลิงดินเผาที่ไต่ขึ้นลงตามเชือก เป็นของเล่นที่พบในเมืองสินธุ','Clay bird whistles, animals with moving heads and clay monkeys that climb up and down a string are among the toys found in Indus cities.'),fx:{b:2}}),
E8({a:[6,70],w:1.4,cond:S=>S.rg!=='vil',x:X('คุณดึงเชือกตักน้ำจากบ่ออิฐในลานบ้าน ขอบบ่อมีร่องลึกที่เชือกนับพันเส้นถูไว้','You haul water from the brick well in the courtyard. The rim is worn into deep grooves by thousands of ropes.'),n:X('โมเฮนโจ-ดาโรมีบ่อน้ำบุอิฐหลายร้อยบ่อ หลายบ่ออยู่ในบ้าน บางบ่ออยู่ริมถนนให้คนทั่วไปใช้ ขอบบ่อบางบ่อยังเห็นร่องที่เชือกถูมานานหลายชั่วคน','Mohenjo-daro had hundreds of brick-lined wells, many inside houses and some on the streets for everyone. Some rims still show grooves worn by ropes over generations.')}),
E8({a:[6,70],w:1.3,x:X('คุณช่วยปั่นด้ายฝ้ายด้วยแกนปั่นดินเผา ด้ายขาดทุกสามรอบ จนแม่หัวเราะ','You help spin cotton thread on a clay spindle. The thread breaks every third turn, and your mother laughs.'),n:X('ลุ่มแม่น้ำสินธุเป็นที่แรกๆ ของโลกที่ปลูกฝ้ายและทอผ้าฝ้าย พบเส้นใยฝ้ายในลูกปัดทองแดงจากเมห์รการห์ อายุราว 7,000 ปี และรอยผ้าฝ้ายบนภาชนะเงินที่โมเฮนโจ-ดาโร','The Indus region was one of the first places in the world to grow cotton and weave it. Cotton fibres were found in a copper bead from Mehrgarh about 7,000 years old, and traces of cotton cloth on a silver vessel at Mohenjo-daro.')}),
E8({a:[6,70],w:1.2,x:X('ฝูงควายนอนแช่โคลนริมแม่น้ำ เห็นแต่หัวกับเขาโค้งยาว','A herd of buffalo lies in the river mud, only their heads and long curved horns showing.')}),
E8({a:[6,70],w:1.2,fxF:S=>{S.saw.peacock=1},x:X('นกยูงตัวผู้รำแพนหางบนกำแพงบ้าน ร้องเสียงแหลมจนทั้งถนนหันไปดู','A peacock spreads its tail on the house wall and screams until the whole street turns to look.'),n:X('นกยูงพบเป็นลายบนเครื่องปั้นดินเผาของสินธุ โดยเฉพาะในยุคตอนปลาย และเป็นนกพื้นเมืองของเอเชียใต้ ทุกวันนี้นกยูงเป็นนกประจำชาติของอินเดีย','Peacocks appear on Indus pottery, especially in the late period, and are native to South Asia. Today the peacock is India’s national bird.')}),
E8({a:[8,70],w:1.6,fxF:S=>{S.saw.rhino=1;S.sc8a={k:'rhino',age:S.age}},x:X('แรดตัวหนึ่งพุ่งออกมาจากดงกกริมแม่น้ำ ชาวประมงกระโดดลงเรือหนีกันอลหม่าน','A rhinoceros crashes out of the riverside reeds, and the fishermen scramble into their boats.'),n:X('แรดนอเดียวเคยอาศัยตลอดลุ่มแม่น้ำสินธุ และปรากฏบนตราประทับหลายชิ้น จักรพรรดิบาบูร์ยังล่าแรดใกล้เปชาวาร์ในปี ค.ศ. 1519 แรดหายไปจากแถบนี้ราวปลายศตวรรษที่ 16','The one-horned rhinoceros once lived all along the Indus and appears on many seals. The emperor Babur still hunted rhinos near Peshawar in 1519 CE. They disappeared from the region around the end of the 16th century.')}),
E8({a:[8,70],w:1.4,fxF:S=>{S.saw.elephant=1;S.sc8a={k:'elephant',age:S.age}},x:X('ตอนพลบค่ำ ช้างป่าฝูงหนึ่งเดินข้ามแม่น้ำ ลูกช้างจับหางแม่ไว้ไม่ปล่อย','At dusk a herd of wild elephants wades across the river, a calf holding tight to its mother’s tail.'),n:X('ช้างปรากฏบนตราประทับสินธุหลายชิ้น และงาช้างถูกใช้ทำหวี ลูกเต๋า และของประดับ แล้วส่งไปขายถึงเมโสโปเตเมีย ทุกวันนี้ไม่มีช้างป่าในลุ่มแม่น้ำสินธุแล้ว','Elephants appear on many Indus seals, and ivory was carved into combs, dice and ornaments and traded as far as Mesopotamia. Today no wild elephants live in the Indus basin.')}),
E8({a:[8,70],w:1.3,fxF:S=>{S.saw.tiger=1;S.sc8a={k:'tiger',age:S.age}},cond:S=>herdTot()>0,x:X('เสือตัวหนึ่งลากลูกควายไปจากคอกตอนกลางคืน เช้ามาเห็นแต่รอยเท้าใหญ่เท่าฝ่ามือ','In the night a tiger drags a buffalo calf from the pen. In the morning there are only pawprints as big as your hand.'),n:X('เสือปรากฏบนตราประทับสินธุ บางชิ้นแสดงคนยืนอยู่ระหว่างเสือสองตัว หรือบนต้นไม้ที่มีเสือรออยู่ข้างล่าง ทุกวันนี้เสือหายไปจากลุ่มแม่น้ำสินธุนานแล้ว','Tigers appear on Indus seals; some show a person between two tigers, or up a tree with a tiger waiting below. Tigers vanished from the Indus valley long ago.')}),
E8({a:[6,70],w:1.2,fxF:S=>{S.saw.gharial=1;S.sc8a={k:'gharial',age:S.age}},x:X('ตะโขงตัวยาวนอนผึ่งแดดบนสันดอนทราย ปากเรียวยาวเหมือนไม้','A long gharial suns itself on a sandbank, its snout as thin as a stick.'),n:X('ตะโขงกินปลาเป็นหลัก ไม่ค่อยทำร้ายคน ภาพตะโขงพบบนแผ่นดินเผาและตราประทับสินธุ ทุกวันนี้มันแทบหายไปจากแม่น้ำสินธุ เหลืออยู่ในแม่น้ำไม่กี่สายในอินเดียและเนปาล และใกล้สูญพันธุ์อย่างยิ่ง','The gharial eats mostly fish and rarely harms people. It appears on Indus tablets and seals. Today it has nearly vanished from the Indus and survives in a few rivers of India and Nepal, critically endangered.')}),
E8({a:[5,70],w:1.2,fxF:S=>{S.sc8a={k:'croc',age:S.age};if(S.herd.goat>0)addHerd('goat',-1)},cond:S=>herdTot()>0,x:X('จระเข้ลากแพะของบ้านคุณลงน้ำไปตอนมันก้มกินน้ำ','A mugger crocodile drags one of your goats into the river as it bends to drink.')}),
E8({a:[6,70],w:1.2,x:X('ลมร้อนพัดฝุ่นจากทะเลทรายมาทั้งวัน ทุกคนปิดหน้าต่างไม้และอยู่แต่ในห้องที่หันเข้าลานบ้าน','A hot wind blows dust from the desert all day. Everyone shuts the wooden shutters and stays in the rooms that face the courtyard.'),n:X('บ้านในเมืองสินธุมักหันประตูเข้าตรอกข้าง และมีลานกลางบ้าน กำแพงที่ติดถนนใหญ่แทบไม่มีหน้าต่าง ซึ่งช่วยกันฝุ่น เสียง และความร้อน','Indus houses usually had their doors on side lanes and a central courtyard; walls facing the main streets had few windows, keeping out dust, noise and heat.')}),
E8({a:[8,70],w:1.3,cond:S=>S.rg==='dho',x:X('เหนือประตูเมืองด้านเหนือมีป้ายแขวนอยู่ ตัวอักษรสิบตัว ขนาดใหญ่เท่าหัวคน ฝังด้วยหินขาว คนแปลกหน้าทุกคนหยุดมอง','Above the north gate hangs a board of ten signs, each as big as a head, inlaid in white stone. Every stranger stops to look.'),n:X('ป้ายที่โธลาวีราประกอบด้วยตัวอักษรสินธุสิบตัวทำจากชิ้นยิปซัมสีขาว น่าจะเคยติดบนแผ่นไม้ที่ผุไปแล้ว พบใกล้ประตูเมือง เป็นจารึกสินธุที่ใหญ่ที่สุดที่รู้จัก แต่ก็ยังอ่านไม่ออก','The Dholavira signboard is made of ten Indus signs of white gypsum pieces, probably once set on a wooden board that has rotted away. Found near a city gate, it is the largest Indus inscription known, and it still cannot be read.')}),
E8({a:[14,70],w:1.2,x:X('เกวียนวัวโหนกเรียงกันยาวเข้าเมือง บรรทุกฝ้าย งา และหม้อดินเผา ล้อไม้ทึบเสียงดังเอี๊ยดอ๊าดไปทั้งถนน','A long line of ox-carts rolls into town with cotton, sesame and pots, their solid wooden wheels creaking down the street.')}),
E8({a:[20,70],w:1.6,once:1,cond:S=>era8(S.ya)==='late',fxF:S=>{fx({b:-3})},x:X('ชายสองกลุ่มทะเลาะกันเรื่องบ่อน้ำบ่อสุดท้ายที่ยังมีน้ำ ก่อนเย็นมีคนหัวแตก','Two groups of men quarrel over the last well that still has water. By evening someone’s skull is cracked.'),n:X('การศึกษาโครงกระดูกจากฮารัปปาพบว่าร่องรอยการบาดเจ็บที่ศีรษะเพิ่มขึ้นในช่วงที่เมืองเสื่อมและผู้คนทยอยออกจากเมือง ทั้งที่ความรุนแรงพบน้อยในแหล่งโบราณคดีเอเชียใต้ยุคก่อนหน้า','Studies of skeletons from Harappa found that head injuries increased as the city declined and people left, although violence is rare at earlier South Asian sites.')}),
E8({a:[45,85],w:1.2,x:X('ตาของคุณพร่ามัวจนต้องให้หลานช่วยร้อยลูกปัด','Your eyes are so dim that a grandchild must thread your beads for you.')}),
E8({a:[45,85],w:1,x:X('คุณนั่งบนหลังคาบ้านตอนเย็น ดูเรือล่องลงแม่น้ำ เหมือนที่เคยดูตอนเป็นเด็ก','You sit on the roof in the evening and watch the boats go down the river, as you did as a child.')}),
/* ---------- signs of ancient belief (the religion thread) ---------- */
E8({a:[8,70],w:2.2,once:1,cond:S=>S.rg==='moh',fxF:relF('bath'),x:X('บนเนินป้อม ผู้คนเดินลงบันไดอิฐสู่สระน้ำใหญ่ที่ยาด้วยยางมะตอยกันรั่ว ทุกคนเดินขึ้นมาเงียบๆ เหมือนมีอะไรบางอย่างเปลี่ยนไป','On the citadel mound, people walk down brick steps into a great tank sealed with bitumen. Everyone comes up quiet, as if something has changed.'),
 n:X('สระน้ำใหญ่แห่งโมเฮนโจ-ดาโรลึกราว 2.4 เมตร พื้นที่ราว 12 × 7 เมตร มีบันไดลงทั้งสองด้าน พื้นปูอิฐสองชั้นมียางมะตอยกั้นกลาง น้ำมาจากบ่อในห้องข้างๆ เราไม่รู้แน่ว่าใช้ทำอะไร แต่นักวิชาการส่วนใหญ่เชื่อว่าเป็นที่อาบน้ำชำระในพิธี','The Great Bath of Mohenjo-daro is about 2.4 metres deep and about 12 by 7 metres, with steps at both ends and a floor of two layers of brick sealed with bitumen between them. Water came from a well in a nearby room. Its exact use is unknown, but most scholars link it to ritual bathing.')}),
E8({a:[3,60],w:1.8,once:1,fxF:relF('fig'),x:X('ในซุ้มกำแพงบ้าน มีตุ๊กตาดินเผารูปผู้หญิงสวมเครื่องประดับหัวรูปพัดและสร้อยหลายเส้น แม่จุดตะเกียงไว้ตรงหน้าทุกเย็น','In the niche of the house wall stand clay women with fan-shaped headdresses and many necklaces. Your mother lights a lamp before them every evening.'),
 n:X('ตุ๊กตาดินเผารูปผู้หญิงพบมากในบ้านของเมืองสินธุ นักโบราณคดีรุ่นแรกเรียกว่า “แม่พระธรณี” บางคนคิดว่าบางตัวเป็นของเล่นหรือของถวาย หลายตัวพบหักอยู่ในกองขยะ ความหมายจริงยังไม่มีใครรู้','Clay figurines of women are common in Indus houses. Early archaeologists called them “mother goddesses”; others think some were toys or offerings. Many are found broken in rubbish heaps. Their real meaning is unknown.')}),
E8({a:[10,70],w:2,once:1,cond:S=>['seal','merchant','ritual'].includes(S.car)||S.sig>=20||S.focus==='story',fxF:relF('horned'),x:X('ช่างแกะตราเก่าคนหนึ่งให้คุณดูตราประทับเก่า เป็นรูปคนนั่งงอเข่า ส้นเท้าชนกัน บนแท่นเตี้ย สวมเขาควายขนาดใหญ่ รอบตัวมีช้าง เสือ แรด และควาย','An old seal-cutter shows you an ancient seal: a figure sits with knees bent and heels together on a low seat, wearing great buffalo horns, with an elephant, a tiger, a rhinoceros and a buffalo around it.'),
 n:X('ตราประทับนี้พบที่โมเฮนโจ-ดาโร อายุราว 2500 ปีก่อนคริสตกาล ในปี 1931 จอห์น มาร์แชลล์เสนอว่าเป็นต้นแบบของพระศิวะในฐานะ “ปศุปติ” เจ้าแห่งสัตว์ และนั่งในท่าโยคะ หลายคนแย้งว่าตรานี้เก่ากว่าคัมภีร์พระเวทนับพันปี ไม่แน่ว่าเป็นท่าโยคะ และไม่แน่แม้แต่ว่าเป็นชายหรือหญิง นักวิชาการบางคนเสนอว่าเป็น “คนวัว” ศักดิ์สิทธิ์ หรือเป็นภาพเกี่ยวกับการล่า','This seal was found at Mohenjo-daro, about 2500 BCE. In 1931 John Marshall proposed that it showed an early form of Shiva as “Pashupati”, lord of animals, seated in a yoga posture. Many object that the seal is a thousand years older than the Vedas, that the pose may not be yoga, and that it is not even clear whether the figure is male or female. Some scholars suggest a divine bull-man, or a scene about hunting.')}),
E8({a:[8,70],w:2,once:1,cond:S=>['kal','dho','lot'].includes(S.rg),fxF:relF('fire'),x:X('ในห้องแถวหนึ่ง มีหลุมเล็กๆ บุดินเรียงกัน กลางหลุมมีเสาดินเหนียว รอบๆ มีขี้เถ้าและเศษกระดูกสัตว์ ผู้ใหญ่ห้ามเด็กเข้าไปใกล้','In one row of rooms there are small clay-lined pits in a line, each with a clay post in the middle and ash and bits of animal bone around it. The grown-ups keep the children away.'),
 n:X('ที่กาลีบังกันและเมืองอื่นบางแห่งพบหลุมไฟเรียงเป็นแถวแบบนี้ นักโบราณคดีหลายคนตีความว่าเป็นแท่นบูชาไฟ บางคนเชื่อมโยงกับพิธีบูชาไฟในศาสนาพระเวทยุคหลัง แต่บางคนเห็นว่าอาจเป็นเตาธรรมดา ข้อนี้ยังถกเถียงกัน','Rows of fire pits like these were found at Kalibangan and some other towns. Many archaeologists read them as fire altars, and some link them to the fire rituals of the later Vedic religion, while others think they may be ordinary hearths. This is still debated.')}),
E8({a:[6,70],w:1.6,once:1,fxF:relF('pipal'),x:X('แม่วาดลายใบโพธิ์ลงบนหม้อน้ำใบใหม่ บอกว่าต้นโพธิ์ใหญ่ริมบ่อเป็นต้นไม้ที่ต้องเคารพ','Your mother paints pipal leaves on a new water pot and says the great pipal tree by the well must be respected.'),

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll('.langBtns').forEach(box=>{if(!box.children.length)box.innerHTML=LANGLIST.map(([k,n])=>'<button data-lang="'+k+'" lang="'+k+'">'+n+'</button>').join('');box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang))});

}

  x.fillStyle='#ede4d4';x.font='400 21px Anuphan, sans-serif';wrap(x,t('clockLine',{n:S.age,s:sec}),pad,y,632,30);
  $('#cardImg').src=c.toDataURL('image/png');$('#cardImg').alt=L(S.sp.n)+' · '+L(S.title);

function wrap(ctx,text,x,y,max,lh){
  const seg=(typeof Intl!=='undefined'&&Intl.Segmenter)?[...new Intl.Segmenter(lang,{granularity:'word'}).segment(text)].map(s=>s.segment):text.split(/(\s+)/);
  let line='';for(const w of seg){const test=line+w;if(ctx.measureText(test).width>max&&line){ctx.fillText(line.trim(),x,y);y+=lh;line=w.trimStart()}else line=test}
  if(line)ctx.fillText(line.trim(),x,y);return y}
